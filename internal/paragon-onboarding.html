<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Becoming Paragon · Internal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --ivory: #FFF6EC; --beige: #F1E2CC; --taupe: #CBB9A3;
    --gold: #C8A76A; --gold-deep: #A8884E; --blush: #F6D6CF;
    --ink: #2A2417; --ink-soft: #6B5E48; --line: #EADBC0;
    --shadow: rgba(168, 136, 78, 0.18);
    --bg-dark: #1a1a2e; --bg-dark2: #2c2418;
    --green: #5a7a3e; --green-bg: #f4f9ee;
    --red: #a8564e; --red-bg: #fdf2f0;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Sarabun', 'Prompt', -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--font-body); -webkit-font-smoothing: antialiased; color: var(--ink); overflow: hidden; }
body { background: var(--bg-dark); }

/* LOCK */
.lock-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; position: relative; overflow: hidden; background: linear-gradient(135deg, #1a1a2e 0%, #2c2418 50%, #1a1a2e 100%); }
.lock-screen::before, .lock-screen::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(200,167,106,0.15) 40%, transparent 70%); }
.lock-screen::before { width: 360px; height: 360px; top: -100px; right: -80px; }
.lock-screen::after { width: 260px; height: 260px; bottom: -80px; left: -60px; opacity: 0.6; }
.lock-card { background: rgba(255, 246, 236, 0.08); backdrop-filter: blur(24px); border: 1px solid rgba(200,167,106,0.25); border-radius: 28px; padding: 3rem 2.5rem; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 32px 80px rgba(0,0,0,0.5); position: relative; z-index: 1; }
.lock-icon { width: 84px; height: 84px; margin: 0 auto 1.5rem; background: linear-gradient(135deg, var(--gold), var(--gold-deep)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: #fff; box-shadow: 0 12px 36px rgba(200,167,106,0.4), 0 0 0 8px rgba(200,167,106,0.08); }
.lock-brand { color: var(--gold); font-size: 0.78rem; letter-spacing: 0.35em; font-weight: 700; margin-bottom: 0.5rem; }
.lock-title { color: #fff; font-family: var(--font-display); font-size: 1.9rem; font-weight: 600; margin-bottom: 0.5rem; }
.lock-sub { color: rgba(255,246,236,0.6); font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.7; }
.lock-form { display: flex; flex-direction: column; gap: 1rem; }
.lock-input { width: 100%; padding: 1rem 1.25rem; background: rgba(255,246,236,0.08); border: 1px solid rgba(200,167,106,0.25); border-radius: 14px; color: #fff; font-size: 1rem; font-family: inherit; outline: none; transition: all 0.3s; }
.lock-input:focus { border-color: var(--gold); background: rgba(255,246,236,0.12); box-shadow: 0 0 0 4px rgba(200,167,106,0.12); }
.lock-input::placeholder { color: rgba(255,246,236,0.4); }
.lock-btn { padding: 1rem; background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #fff; border: none; border-radius: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; font-family: inherit; letter-spacing: 0.05em; }
.lock-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(200,167,106,0.45); }
.lock-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.lock-error { color: #ff8a8a; font-size: 0.9rem; min-height: 1.2rem; }
.lock-confidential { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(200,167,106,0.15); color: rgba(200,167,106,0.55); font-size: 0.7rem; letter-spacing: 0.25em; }

/* PRES */
.pres { display: none; position: fixed; inset: 0; background: var(--ivory); }
.pres.active { display: block; }
.pres-bar { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: rgba(200,167,106,0.2); z-index: 50; }
.pres-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-deep)); transition: width 0.4s ease; width: 0; }
.pres-controls { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 0.5rem; background: rgba(26,26,46,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(200,167,106,0.3); border-radius: 100px; padding: 0.4rem 0.6rem; z-index: 50; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.pres-controls.show { opacity: 1; pointer-events: auto; }
.pres-btn { background: transparent; border: none; color: var(--gold); padding: 0.5rem 0.85rem; border-radius: 100px; cursor: pointer; font-family: inherit; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.05em; transition: all 0.2s; }
.pres-btn:hover { background: rgba(200,167,106,0.2); color: #fff; }
.pres-btn-icon { padding: 0.5rem 0.7rem; font-size: 1rem; }
.pres-counter { color: var(--gold); font-size: 0.85rem; padding: 0 0.75rem; letter-spacing: 0.1em; font-family: var(--font-display); font-weight: 600; }
.pres-help { position: fixed; top: 1rem; right: 1rem; background: rgba(26,26,46,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(200,167,106,0.3); border-radius: 14px; padding: 0.75rem 1rem; z-index: 50; opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 280px; }
.pres-help.show { opacity: 1; }
.pres-help h4 { color: var(--gold); font-size: 0.75rem; letter-spacing: 0.2em; margin-bottom: 0.5rem; font-family: var(--font-display); }
.pres-help div { color: #fff; font-size: 0.78rem; line-height: 1.7; }
.pres-help kbd { background: rgba(200,167,106,0.2); color: var(--gold); padding: 0.1rem 0.45rem; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 0.72rem; }
.slides-wrap { position: absolute; inset: 0; overflow: hidden; }
.slide { position: absolute; inset: 0; padding: 5vh 6vw; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: var(--ivory); opacity: 0; transition: opacity 0.6s ease, transform 0.6s ease; transform: translateX(40px); pointer-events: none; overflow-y: auto; }
.slide.active { opacity: 1; transform: translateX(0); pointer-events: auto; z-index: 2; }
.slide.prev { transform: translateX(-40px); }
.slide-bg-orb { position: absolute; border-radius: 50%; pointer-events: none; }
.orb-1 { width: 480px; height: 480px; top: -180px; right: -120px; background: radial-gradient(circle at 30% 30%, rgba(200,167,106,0.25), rgba(246,214,207,0.1) 40%, transparent 70%); }
.orb-2 { width: 360px; height: 360px; bottom: -140px; left: -100px; background: radial-gradient(circle at 50% 50%, rgba(246,214,207,0.2), transparent 70%); }

.slide-title { background: linear-gradient(135deg, #1a1a2e 0%, #2c2418 100%); color: #fff; }
.slide-title .slide-eyebrow { color: var(--gold); }
.slide-title .slide-subtitle, .slide-title .slide-meta { color: rgba(255,246,236,0.75); }
.slide-eyebrow { font-size: 0.85rem; letter-spacing: 0.4em; color: var(--gold-deep); font-weight: 600; margin-bottom: 2rem; font-family: var(--font-display); }
.slide-megatitle { font-family: var(--font-display); font-size: clamp(3rem, 8vw, 6rem); font-weight: 600; line-height: 1.05; margin-bottom: 1.5rem; letter-spacing: -0.01em; }
.slide-megatitle em { font-style: italic; color: var(--gold); font-weight: 600; }
.slide-subtitle { font-family: var(--font-display); font-size: clamp(1rem, 2vw, 1.5rem); color: var(--ink-soft); font-style: italic; letter-spacing: 0.05em; margin-bottom: 1.5rem; }
.slide-meta { color: var(--ink-soft); font-size: 1.05rem; max-width: 620px; line-height: 1.75; }
.slide-hint { position: absolute; bottom: 4rem; color: rgba(200,167,106,0.6); font-size: 0.85rem; letter-spacing: 0.15em; }
.slide-hint kbd { background: rgba(200,167,106,0.18); color: var(--gold); padding: 0.15rem 0.6rem; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 0.85rem; margin: 0 0.15rem; }
.slide-tag { display: inline-block; background: rgba(200,167,106,0.12); color: var(--gold-deep); border: 1px solid rgba(200,167,106,0.3); padding: 0.4rem 1.1rem; border-radius: 100px; font-size: 0.8rem; letter-spacing: 0.18em; font-weight: 600; margin-bottom: 2rem; }
.slide-h2 { font-family: var(--font-display); font-size: clamp(1.9rem, 4vw, 3.2rem); font-weight: 500; color: var(--ink); margin-bottom: 2rem; line-height: 1.3; max-width: 1100px; }
.slide-h2 em { font-style: italic; color: var(--gold-deep); font-weight: 500; }
.slide-huge { font-family: var(--font-display); font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 500; line-height: 1.2; max-width: 1100px; margin-bottom: 1.5rem; color: var(--ink); }
.hl-gold { color: var(--gold-deep); font-style: italic; }
.hl-red { color: var(--red); font-style: italic; }
.slide-quote-big { font-family: var(--font-display); font-size: clamp(1.7rem, 4vw, 3rem); font-style: italic; line-height: 1.4; color: var(--gold-deep); margin: 1.5rem 0 2rem; padding: 2rem 3rem; background: linear-gradient(135deg, rgba(255,246,236,0.7), rgba(241,226,204,0.4)); border-radius: 28px; border-left: 4px solid var(--gold); max-width: 1000px; font-weight: 500; }
.slide-prompt { font-size: clamp(1rem, 1.7vw, 1.3rem); color: var(--ink); line-height: 1.75; max-width: 900px; margin-bottom: 1rem; }
.slide-prompt strong { color: var(--gold-deep); }
.slide-prompt em { color: var(--gold-deep); font-style: italic; }
.slide-note-small { font-size: 0.95rem; color: var(--ink-soft); font-style: italic; line-height: 1.65; max-width: 760px; }

.three-persons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; margin: 1.5rem 0 2rem; max-width: 1100px; width: 100%; }
.person-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 2rem 1.5rem; box-shadow: 0 8px 24px var(--shadow); }
.person-icon { font-size: 2rem; margin-bottom: 0.5rem; }
.person-role { font-family: var(--font-display); color: var(--gold-deep); font-weight: 600; font-size: 0.95rem; letter-spacing: 0.15em; margin-bottom: 1rem; }
.person-card p { color: var(--ink); font-size: 1rem; line-height: 1.65; }
.person-card p strong { color: var(--gold-deep); }

.slide-callout-gold { background: linear-gradient(135deg, var(--ivory), var(--beige)); border-left: 4px solid var(--gold); color: var(--ink); padding: 1.25rem 1.75rem; border-radius: 14px; font-size: 1.05rem; max-width: 900px; margin-top: 1rem; line-height: 1.7; text-align: left; font-style: italic; }
.slide-callout-gold strong { color: var(--gold-deep); }

.goals-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; max-width: 1100px; width: 100%; }
.goal-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 2.5rem 1.75rem 2rem; position: relative; box-shadow: 0 8px 24px var(--shadow); text-align: left; }
.goal-num { position: absolute; top: -18px; left: 1.5rem; background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #fff; font-family: var(--font-display); font-weight: 700; padding: 0.4rem 0.95rem; border-radius: 10px; font-size: 0.9rem; letter-spacing: 0.1em; }
.goal-card h3 { font-family: var(--font-display); font-size: 1.4rem; color: var(--ink); margin-bottom: 0.5rem; font-weight: 600; }
.goal-card p { color: var(--ink-soft); font-size: 1rem; line-height: 1.6; }

.rules-list { display: flex; flex-direction: column; gap: 1rem; max-width: 800px; width: 100%; }
.rule-item { display: flex; align-items: center; gap: 1.25rem; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 1.25rem 1.5rem; box-shadow: 0 6px 20px var(--shadow); text-align: left; }
.rule-icon { font-size: 1.85rem; flex-shrink: 0; }
.rule-item div { color: var(--ink); font-size: 1.05rem; line-height: 1.65; }
.rule-item strong { color: var(--gold-deep); font-family: var(--font-display); font-weight: 600; }

.slide-divider { background: linear-gradient(135deg, #1a1a2e 0%, #2c2418 100%); color: #fff; }
.slide-divider .slide-subtitle { color: rgba(255,246,236,0.75); }
.slide-divider .slide-meta { color: rgba(255,246,236,0.55); }
.act-number { font-family: var(--font-display); font-size: 0.95rem; letter-spacing: 0.5em; font-weight: 700; margin-bottom: 2rem; color: var(--gold); }
.slide-divider .slide-megatitle em { color: var(--gold); }

.self-quiz { display: flex; flex-direction: column; gap: 0.85rem; max-width: 900px; width: 100%; margin: 1rem 0 1.5rem; }
.quiz-item { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 1.15rem 1.5rem; text-align: left; color: var(--ink); font-size: 1.05rem; line-height: 1.65; box-shadow: 0 4px 14px var(--shadow); position: relative; padding-left: 3.25rem; }
.quiz-item::before { content: '?'; position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--font-display); }
.quiz-item strong { color: var(--gold-deep); }

.perception-flow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.5rem; margin: 2rem 0; }
.pf-node { background: #fff; border: 1px solid var(--gold); padding: 0.7rem 1.1rem; border-radius: 12px; color: var(--ink); font-weight: 500; font-size: 0.95rem; box-shadow: 0 4px 12px var(--shadow); }
.pf-plus, .pf-equals { color: var(--gold-deep); font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; margin: 0 0.25rem; }
.pf-result { background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #fff; padding: 0.8rem 1.4rem; border-radius: 12px; font-weight: 600; box-shadow: 0 6px 18px rgba(200,167,106,0.4); }

.slide-mirror { background: linear-gradient(135deg, var(--gold-deep) 0%, var(--gold) 100%); color: #fff; }
.slide-mirror .slide-huge { color: #fff; max-width: 1000px; }
.slide-mirror .hl-gold { color: #fff; background: rgba(0,0,0,0.18); padding: 0 0.3em; border-radius: 8px; font-style: italic; }
.slide-mirror .slide-prompt { color: rgba(255,246,236,0.95); }
.slide-mirror .slide-prompt strong { color: #fff; }
.slide-mirror .slide-note-small { color: rgba(255,246,236,0.85); }

.slide-promise { padding: 4vh 6vw; }
.promise-card { background: #fff; border: 1px solid var(--gold); border-radius: 28px; padding: 3rem 3.5rem; max-width: 950px; box-shadow: 0 20px 60px var(--shadow); position: relative; text-align: left; }
.promise-card .promise-mark { position: absolute; top: -10px; left: 1.5rem; font-family: var(--font-display); font-size: 5rem; color: var(--gold); line-height: 1; opacity: 0.6; }
.promise-card p { font-family: var(--font-display); font-size: clamp(1.3rem, 2.3vw, 1.9rem); line-height: 1.6; color: var(--ink); margin-bottom: 1.25rem; font-weight: 500; }
.promise-card p:last-child { margin-bottom: 0; }
.promise-card strong { color: var(--gold-deep); font-weight: 600; font-style: italic; }

.forNot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; max-width: 1200px; width: 100%; }
.for-col, .not-col { background: #fff; border-radius: 20px; padding: 2rem; box-shadow: 0 8px 24px var(--shadow); text-align: left; }
.for-col { border: 1px solid #c8d9b1; background: linear-gradient(135deg, var(--green-bg), #fbfdf7); }
.not-col { border: 1px solid #e8b5b0; background: linear-gradient(135deg, var(--red-bg), #fef7f5); }
.col-head { font-family: var(--font-display); font-size: 1rem; letter-spacing: 0.2em; font-weight: 700; margin-bottom: 1.25rem; }
.head-gold { color: var(--green); }
.head-red { color: var(--red); }
.for-col ul, .not-col ul { list-style: none; }
.for-col ul li, .not-col ul li { padding: 0.55rem 0 0.55rem 1.6rem; position: relative; color: var(--ink); font-size: 1rem; line-height: 1.65; }
.for-col ul li::before { content: '✓'; position: absolute; left: 0; color: var(--green); font-weight: 700; }
.not-col ul li::before { content: '—'; position: absolute; left: 0; color: var(--red); font-weight: 700; }
.for-col ul li strong, .not-col ul li strong { color: var(--gold-deep); font-weight: 600; }

.beauty-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.65rem; max-width: 1100px; margin: 0.85rem 0 1.25rem; }
.b-tag { background: rgba(200,167,106,0.13); color: var(--gold-deep); padding: 0.55rem 1.1rem; border-radius: 100px; font-size: 1rem; font-weight: 500; border: 1px solid rgba(200,167,106,0.3); }
.b-tag.bad { background: rgba(168,86,78,0.08); color: var(--red); border-color: rgba(168,86,78,0.25); opacity: 0.85; }

.method-flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr; gap: 0.5rem; align-items: center; max-width: 1200px; width: 100%; margin: 1.5rem 0; }
.method-step { background: #fff; border: 1px solid var(--gold); border-radius: 18px; padding: 1.5rem 1rem; text-align: center; box-shadow: 0 6px 20px var(--shadow); }
.ms-num { font-family: var(--font-display); font-size: 0.9rem; letter-spacing: 0.2em; color: var(--gold-deep); font-weight: 700; margin-bottom: 0.5rem; }
.ms-en { font-family: var(--font-display); font-size: 1.2rem; color: var(--ink); font-weight: 600; margin-bottom: 0.4rem; letter-spacing: 0.08em; }
.ms-th { color: var(--ink-soft); font-size: 0.9rem; line-height: 1.5; }
.method-arrow { color: var(--gold); font-size: 1.6rem; font-weight: 400; }
.quote-callout { background: linear-gradient(135deg, var(--ivory), var(--beige)); border-left: 4px solid var(--gold); padding: 1.25rem 1.75rem; border-radius: 14px; color: var(--ink); font-style: italic; font-family: var(--font-display); font-size: 1.2rem; line-height: 1.65; max-width: 1000px; margin-top: 1.5rem; text-align: left; }
.quote-callout strong { color: var(--gold-deep); font-weight: 600; }

.role-shift { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1.5rem; align-items: center; max-width: 1100px; width: 100%; margin-bottom: 2rem; }
.rs-old, .rs-new { padding: 2rem 1.75rem; border-radius: 18px; text-align: left; }
.rs-old { background: linear-gradient(135deg, #f5f1ea, #faf6ef); border: 1px solid var(--taupe); }
.rs-new { background: linear-gradient(135deg, var(--ivory), var(--beige)); border: 1px solid var(--gold); box-shadow: 0 8px 24px var(--shadow); }
.rs-label { font-family: var(--font-display); font-size: 0.78rem; letter-spacing: 0.25em; color: var(--ink-soft); margin-bottom: 0.75rem; font-weight: 700; }
.rs-new .rs-label { color: var(--gold-deep); }
.rs-text { font-family: var(--font-display); font-size: 1.15rem; color: var(--ink); line-height: 1.55; font-style: italic; }
.rs-arrow { color: var(--gold); font-size: 2rem; font-weight: 400; }
.role-grid-mini { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.85rem; max-width: 1000px; width: 100%; }
.role-grid-mini > div { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 0.9rem 1.25rem; text-align: left; color: var(--ink); font-size: 1rem; box-shadow: 0 4px 12px var(--shadow); line-height: 1.55; }
.role-grid-mini strong { color: var(--gold-deep); }

.slide-mantra { background: linear-gradient(135deg, #1a1a2e 0%, #2c2418 100%); color: #fff; padding: 6vh 6vw; }
.slide-mantra .slide-eyebrow { color: var(--gold); margin-bottom: 3rem; }
.mantra-line { font-family: var(--font-display); font-size: clamp(1.3rem, 2.4vw, 2rem); font-weight: 400; line-height: 1.5; color: rgba(255,246,236,0.95); margin-bottom: 1.5rem; max-width: 1100px; display: flex; align-items: center; gap: 1.25rem; text-align: left; }
.mantra-line em { font-style: italic; color: var(--gold); font-weight: 500; }
.mantra-line.large { font-size: clamp(1.5rem, 3vw, 2.4rem); }
.mantra-num { width: 48px; height: 48px; background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; flex-shrink: 0; box-shadow: 0 8px 24px rgba(200,167,106,0.4); font-family: var(--font-display); }
.mantra-cta { margin-top: 2rem; color: var(--gold); font-size: 1rem; letter-spacing: 0.15em; font-family: var(--font-display); font-style: italic; }
.slide-mantra-final .mantra-cta { color: #fff; font-size: 1.2rem; }

.vs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; max-width: 1200px; width: 100%; margin-top: 1rem; }
.vs-bad, .vs-good { padding: 1.85rem; border-radius: 20px; text-align: left; box-shadow: 0 8px 24px var(--shadow); }
.vs-bad { background: linear-gradient(135deg, var(--red-bg), #fef7f5); border: 1px solid #e8b5b0; }
.vs-good { background: linear-gradient(135deg, var(--green-bg), #fbfdf7); border: 1px solid #c8d9b1; }
.vs-label { font-family: var(--font-display); font-size: 0.85rem; letter-spacing: 0.2em; font-weight: 700; margin-bottom: 1rem; }
.vs-bad .vs-label { color: var(--red); }
.vs-good .vs-label { color: var(--green); }
.vs-bad p, .vs-good p { color: var(--ink); font-size: 1.05rem; line-height: 1.7; margin-bottom: 1rem; }
.vs-bad p strong, .vs-good p strong { color: var(--gold-deep); }
.vs-why { font-size: 0.92rem; color: var(--ink-soft); font-style: italic; padding-top: 0.85rem; border-top: 1px solid rgba(0,0,0,0.08); line-height: 1.6; }
.vs-why strong { color: var(--gold-deep); font-style: normal; }

.exercise-box { background: #fff; border: 1px dashed var(--gold); border-radius: 20px; padding: 2rem 2.5rem; max-width: 820px; width: 100%; text-align: left; box-shadow: 0 8px 24px var(--shadow); }
.ex-step { display: flex; align-items: center; gap: 1rem; padding: 0.65rem 0; color: var(--ink); font-size: 1.05rem; line-height: 1.55; }
.ex-num { width: 32px; height: 32px; background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem; flex-shrink: 0; font-family: var(--font-display); }

.vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; max-width: 1200px; width: 100%; margin-top: 1rem; }
.vocab-col { padding: 1.85rem; border-radius: 20px; text-align: left; box-shadow: 0 8px 24px var(--shadow); display: flex; flex-direction: column; align-items: flex-start; gap: 0.55rem; }
.vocab-good { background: linear-gradient(135deg, var(--green-bg), #fbfdf7); border: 1px solid #c8d9b1; }
.vocab-bad { background: linear-gradient(135deg, var(--red-bg), #fef7f5); border: 1px solid #e8b5b0; }
.vocab-head { font-family: var(--font-display); font-size: 0.95rem; letter-spacing: 0.2em; font-weight: 700; margin-bottom: 0.5rem; width: 100%; }
.vocab-good .vocab-head { color: var(--green); }
.vocab-bad .vocab-head { color: var(--red); }

.tone-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; max-width: 1100px; width: 100%; margin: 1rem 0 1.5rem; }
.tone-item { background: #fff; border: 1px solid var(--gold); border-radius: 100px; padding: 1rem 1.5rem; font-family: var(--font-display); font-size: 1.15rem; color: var(--gold-deep); font-weight: 500; box-shadow: 0 4px 14px var(--shadow); }

.ritual-list { display: flex; flex-direction: column; gap: 1.25rem; max-width: 900px; width: 100%; }
.ritual-item { display: flex; align-items: center; gap: 1.5rem; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 1.5rem 1.85rem; text-align: left; box-shadow: 0 6px 20px var(--shadow); }
.ritual-num { font-family: var(--font-display); font-size: 2.5rem; color: var(--gold); font-weight: 600; flex-shrink: 0; line-height: 1; min-width: 60px; }
.ritual-item h3 { font-family: var(--font-display); font-size: 1.25rem; color: var(--ink); margin-bottom: 0.25rem; font-weight: 600; }
.ritual-item p { color: var(--ink-soft); font-size: 1rem; line-height: 1.6; font-style: italic; }

.check-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; max-width: 1100px; width: 100%; margin: 1rem 0 1.5rem; }
.check-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 2rem 1.5rem; box-shadow: 0 8px 24px var(--shadow); }
.check-icon { font-size: 2.5rem; color: var(--gold); font-family: var(--font-display); line-height: 1; margin-bottom: 0.5rem; font-weight: 700; }
.check-card h3 { font-family: var(--font-display); font-size: 1.5rem; color: var(--ink); margin-bottom: 0.75rem; font-weight: 600; letter-spacing: 0.1em; }
.check-card p { color: var(--ink-soft); font-size: 0.98rem; line-height: 1.65; }
.check-card p strong { color: var(--gold-deep); }

.day-plan { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; max-width: 1300px; width: 100%; margin-top: 1rem; }
.day-card { background: linear-gradient(180deg, #fff, var(--ivory)); border: 1px solid var(--line); border-radius: 18px; padding: 1.85rem 1.35rem; text-align: left; box-shadow: 0 6px 20px var(--shadow); }
.day-tag { display: inline-block; background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #fff; padding: 0.3rem 0.85rem; border-radius: 8px; font-family: var(--font-display); font-size: 0.8rem; letter-spacing: 0.15em; font-weight: 700; margin-bottom: 1rem; }
.day-card h3 { font-family: var(--font-display); font-size: 1.2rem; color: var(--ink); margin-bottom: 0.5rem; font-weight: 600; line-height: 1.35; }
.day-card p { color: var(--ink-soft); font-size: 0.95rem; line-height: 1.6; }

.commit-list { display: flex; flex-direction: column; gap: 1rem; max-width: 820px; width: 100%; }
.commit-item { background: #fff; border: 1px dashed var(--gold); border-radius: 16px; padding: 1.35rem 1.75rem; display: flex; align-items: flex-start; gap: 1.25rem; text-align: left; box-shadow: 0 6px 20px var(--shadow); }
.commit-num { width: 38px; height: 38px; background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; flex-shrink: 0; margin-top: 0.1rem; }
.commit-item div { color: var(--ink); font-size: 1.05rem; line-height: 1.65; }
.commit-item div strong { color: var(--gold-deep); }
.commit-item em.muted { color: var(--ink-soft); font-size: 0.92rem; display: block; margin-top: 0.4rem; font-style: italic; }

.pledge-card { background: linear-gradient(135deg, #1a1a2e, #2c2418); color: #fff; border: 1px solid var(--gold); border-radius: 24px; padding: 3rem 3.5rem; max-width: 1000px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: left; }
.pledge-mark { position: absolute; top: -10px; left: 1.5rem; font-family: var(--font-display); font-size: 5rem; color: var(--gold); line-height: 1; opacity: 0.6; }
.pledge-card p { font-family: var(--font-display); font-size: clamp(1.15rem, 2.1vw, 1.6rem); line-height: 1.7; margin-bottom: 1.25rem; color: rgba(255,246,236,0.95); font-weight: 400; }
.pledge-card p:last-child { margin-bottom: 0; }
.pledge-card strong { color: var(--gold); font-weight: 500; font-style: italic; }

.slide-final { background: linear-gradient(135deg, #1a1a2e 0%, #2c2418 100%); color: #fff; }
.slide-final .slide-eyebrow { color: var(--gold); }
.slide-final .slide-subtitle { color: rgba(255,246,236,0.75); }
.final-glow { background: linear-gradient(135deg, var(--gold), var(--blush), var(--gold)); background-clip: text; -webkit-background-clip: text; color: transparent; -webkit-text-fill-color: transparent; letter-spacing: 0.05em; font-size: clamp(4rem, 12vw, 8rem); font-weight: 600; }
.closing-line { color: rgba(255,246,236,0.85); font-family: var(--font-display); font-style: italic; font-size: clamp(1.1rem, 1.9vw, 1.5rem); margin-top: 1.5rem; max-width: 800px; line-height: 1.7; }
.closing-line em { color: var(--gold); font-style: italic; }

.closing-question { background: #fff; border: 1px solid var(--gold); border-radius: 24px; padding: 2.5rem 3rem; max-width: 920px; margin-bottom: 1.5rem; box-shadow: 0 12px 40px var(--shadow); }
.closing-question p { font-family: var(--font-display); font-size: 1.35rem; color: var(--ink-soft); font-style: italic; margin-bottom: 1rem; line-height: 1.55; }
.closing-question p.big { font-size: clamp(1.7rem, 3.2vw, 2.6rem); color: var(--ink); font-style: normal; line-height: 1.4; font-weight: 500; }
.closing-question p.big em { color: var(--gold-deep); font-style: italic; }

.slide-thanks { background: linear-gradient(135deg, var(--gold-deep) 0%, var(--gold) 100%); color: #fff; }
.slide-thanks .slide-megatitle { color: #fff; }
.slide-thanks .slide-subtitle { color: rgba(255,255,255,0.9); }
.slide-thanks .slide-meta { color: rgba(255,255,255,0.85); }
.thanks-meta { margin-top: 2.5rem; color: rgba(255,255,255,0.85); font-size: 0.85rem; letter-spacing: 0.25em; font-family: var(--font-display); }

/* OVERVIEW */
.pres.overview .slide { position: relative !important; inset: auto !important; transform: scale(0.22); transform-origin: top left; width: 1600px; height: 900px; opacity: 1 !important; pointer-events: auto; cursor: pointer; transition: all 0.3s; border: 3px solid transparent; border-radius: 24px; flex-shrink: 0; }
.pres.overview .slide.active { border-color: var(--gold); box-shadow: 0 0 0 6px rgba(200,167,106,0.25); }
.pres.overview .slide:hover { transform: scale(0.24); border-color: var(--gold); }
.pres.overview .slides-wrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1rem; padding: 5rem 2rem 2rem; overflow-y: auto; position: absolute; inset: 0; background: linear-gradient(135deg, #1a1a2e, #2c2418); align-content: start; }
.pres.overview .pres-controls, .pres.overview .pres-help { display: none; }
.overview-header { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); background: rgba(26,26,46,0.9); backdrop-filter: blur(12px); border: 1px solid rgba(200,167,106,0.3); border-radius: 100px; padding: 0.5rem 1.25rem; color: var(--gold); font-size: 0.85rem; letter-spacing: 0.2em; z-index: 100; display: none; font-family: var(--font-display); font-weight: 600; }
.pres.overview .overview-header { display: block; }

@media (max-width: 900px) {
    .slide { padding: 5vh 5vw; }
    .three-persons, .goals-row, .vs-grid, .vocab-grid, .check-3, .forNot-grid { grid-template-columns: 1fr; }
    .method-flow { grid-template-columns: 1fr; }
    .method-arrow { transform: rotate(90deg); margin: 0.25rem auto; }
    .day-plan { grid-template-columns: 1fr 1fr; }
    .tone-grid { grid-template-columns: repeat(2, 1fr); }
    .role-shift { grid-template-columns: 1fr; }
    .rs-arrow { transform: rotate(90deg); margin: 0 auto; }
    .perception-flow { font-size: 0.85rem; }
    .promise-card, .pledge-card { padding: 2rem 1.5rem; }
    .pres.overview .slides-wrap { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
    .day-plan { grid-template-columns: 1fr; }
    .tone-grid { grid-template-columns: 1fr; }
}
@media print {
    html, body { overflow: visible; height: auto; background: #fff; }
    .pres-bar, .pres-controls, .pres-help, .lock-screen, .overview-header { display: none !important; }
    .pres { position: static; display: block !important; }
    .slides-wrap { position: static; }
    .slide { position: relative !important; inset: auto !important; opacity: 1 !important; transform: none !important; page-break-after: always; min-height: 100vh; pointer-events: auto; }
    .slide-bg-orb { display: none; }
}
</style>

function b64ToBytes(b64){const bin=atob(b64);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function deriveKey(pw,salt,iter){const baseKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveKey']);return await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);}
async function unlock(){const pw=document.getElementById('pwInput').value;const err=document.getElementById('lockError');const btn=document.getElementById('unlockBtn');err.textContent='';btn.disabled=true;btn.textContent='กำลังเปิด...';try{const salt=b64ToBytes(PB_DATA.salt);const iv=b64ToBytes(PB_DATA.iv);const blob=b64ToBytes(PB_DATA.blob);const key=await deriveKey(pw,salt,PB_DATA.iter);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,blob);renderPres(new TextDecoder().decode(plain));}catch(e){err.textContent='รหัสยังไม่ถูก ลองอีกครั้งนะ';btn.disabled=false;btn.textContent='เริ่มกันเลย';document.getElementById('pwInput').value='';}}
let slides=[];let current=0;
function renderPres(html){document.getElementById('lockScreen').style.display='none';document.getElementById('slidesWrap').innerHTML=html;document.getElementById('pres').classList.add('active');slides=Array.from(document.querySelectorAll('#slidesWrap .slide'));document.getElementById('pwInput').value='';go(0);showControls();document.getElementById('presHelp').classList.add('show');setTimeout(()=>document.getElementById('presHelp').classList.remove('show'),5000);}
let controlsTimer;
function showControls(){document.getElementById('presControls').classList.add('show');clearTimeout(controlsTimer);controlsTimer=setTimeout(()=>{document.getElementById('presControls').classList.remove('show');},3000);}
function go(idx){if(idx<0||idx>=slides.length)return;slides.forEach((s,i)=>{s.classList.remove('active','prev');if(i<idx)s.classList.add('prev');if(i===idx)s.classList.add('active');});current=idx;const pct=((idx+1)/slides.length)*100;document.getElementById('presBarFill').style.width=pct+'%';document.getElementById('presCounter').textContent=(idx+1)+' / '+slides.length;if(location.hash!=='#'+(idx+1)){history.replaceState(null,'','#'+(idx+1));}}
function next(){if(current<slides.length-1)go(current+1);showControls();}
function prev(){if(current>0)go(current-1);showControls();}
function toggleOverview(){document.getElementById('pres').classList.toggle('overview');if(!document.getElementById('pres').classList.contains('overview')){slides[current].scrollIntoView({block:'start'});}}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
function toggleHelp(){document.getElementById('presHelp').classList.toggle('show');}
function lockAgain(){document.getElementById('pres').classList.remove('active','overview');document.getElementById('slidesWrap').innerHTML='';document.getElementById('lockScreen').style.display='flex';document.getElementById('unlockBtn').disabled=false;document.getElementById('unlockBtn').textContent='เริ่มกันเลย';document.getElementById('lockError').textContent='';setTimeout(()=>document.getElementById('pwInput').focus(),100);}
document.addEventListener('keydown',(e)=>{if(!document.getElementById('pres').classList.contains('active'))return;const isOverview=document.getElementById('pres').classList.contains('overview');if(isOverview&&e.key==='Escape'){toggleOverview();e.preventDefault();return;}if(e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown'||e.key==='PageDown'){next();e.preventDefault();}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){prev();e.preventDefault();}else if(e.key==='Home'){go(0);e.preventDefault();}else if(e.key==='End'){go(slides.length-1);e.preventDefault();}else if(e.key==='o'||e.key==='O'||e.key==='Escape'){toggleOverview();e.preventDefault();}else if(e.key==='f'||e.key==='F'){toggleFullscreen();e.preventDefault();}else if(e.key==='h'||e.key==='H'||e.key==='?'){toggleHelp();e.preventDefault();}else if(e.key==='l'||e.key==='L'){lockAgain();e.preventDefault();}else if(e.key==='p'||e.key==='P'){window.print();e.preventDefault();}});
document.addEventListener('mousemove',()=>showControls());
document.addEventListener('click',(e)=>{if(!document.getElementById('pres').classList.contains('overview'))return;const slide=e.target.closest('.slide');if(slide){const idx=slides.indexOf(slide);if(idx>=0){go(idx);toggleOverview();}}});
let touchX=0;
document.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>50){if(dx<0)next();else prev();}});
window.addEventListener('load',()=>{if(location.hash){const n=parseInt(location.hash.replace('#',''),10);if(!isNaN(n)&&n>=1&&slides.length>0)go(n-1);}});
</script>
</body>
</html>
