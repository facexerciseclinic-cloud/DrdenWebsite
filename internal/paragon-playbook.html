<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Internal Document · Paragon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --pb-ivory: #FFF6EC;
    --pb-beige: #F1E2CC;
    --pb-taupe: #CBB9A3;
    --pb-gold: #C8A76A;
    --pb-gold-deep: #A8884E;
    --pb-blush: #F6D6CF;
    --pb-ink: #2A2417;
    --pb-ink-soft: #6B5E48;
    --pb-line: #EADBC0;
    --pb-shadow: rgba(168, 136, 78, 0.12);
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Sarabun', 'Prompt', -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--font-body); -webkit-font-smoothing: antialiased; color: var(--pb-ink); }
body { background: linear-gradient(135deg, #1a1a2e 0%, #2c2418 50%, #1a1a2e 100%); min-height: 100vh; }

/* ============ LOCK SCREEN ============ */
.lock-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; position: relative; overflow: hidden; }
.lock-screen::before, .lock-screen::after {
    content: ''; position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(200,167,106,0.15) 40%, transparent 70%);
}
.lock-screen::before { width: 320px; height: 320px; top: -80px; right: -80px; }
.lock-screen::after { width: 240px; height: 240px; bottom: -60px; left: -40px; opacity: 0.6; }
.lock-card { background: rgba(255, 246, 236, 0.08); backdrop-filter: blur(24px); border: 1px solid rgba(200,167,106,0.25); border-radius: 28px; padding: 3rem 2.5rem; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04) inset; position: relative; z-index: 1; }
.lock-icon { width: 84px; height: 84px; margin: 0 auto 1.5rem; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: #fff; box-shadow: 0 12px 36px rgba(200,167,106,0.4), 0 0 0 8px rgba(200,167,106,0.08); }
.lock-brand { color: var(--pb-gold); font-size: 0.78rem; letter-spacing: 0.35em; font-weight: 700; margin-bottom: 0.5rem; }
.lock-title { color: #fff; font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; letter-spacing: 0.02em; }
.lock-sub { color: rgba(255,246,236,0.6); font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.7; }
.lock-form { display: flex; flex-direction: column; gap: 1rem; }
.lock-input { width: 100%; padding: 1rem 1.25rem; background: rgba(255,246,236,0.08); border: 1px solid rgba(200,167,106,0.25); border-radius: 14px; color: #fff; font-size: 1rem; font-family: inherit; outline: none; transition: all 0.3s; }
.lock-input:focus { border-color: var(--pb-gold); background: rgba(255,246,236,0.12); box-shadow: 0 0 0 4px rgba(200,167,106,0.12); }
.lock-input::placeholder { color: rgba(255,246,236,0.4); }
.lock-btn { padding: 1rem; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); color: #fff; border: none; border-radius: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; font-family: inherit; letter-spacing: 0.05em; }
.lock-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(200,167,106,0.45); }
.lock-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.lock-error { color: #ff8a8a; font-size: 0.9rem; min-height: 1.2rem; margin-top: 0.25rem; }
.lock-confidential { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(200,167,106,0.15); color: rgba(200,167,106,0.55); font-size: 0.7rem; letter-spacing: 0.25em; }

/* ============ PLAYBOOK ============ */
.pb-container { display: none; min-height: 100vh; background: linear-gradient(180deg, var(--pb-ivory) 0%, #fffdf7 100%); }
.pb-container.active { display: block; }

.pb-confidential-bar { background: linear-gradient(135deg, #1a1a2e, #2c2418); color: var(--pb-gold); padding: 0.55rem 2rem; text-align: center; font-size: 0.72rem; letter-spacing: 0.25em; font-weight: 600; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
.pb-conf-actions { display: flex; gap: 0.5rem; }
.pb-conf-btn { background: rgba(200,167,106,0.15); border: 1px solid rgba(200,167,106,0.35); color: var(--pb-gold); padding: 0.3rem 0.85rem; border-radius: 8px; font-size: 0.7rem; cursor: pointer; letter-spacing: 0.15em; font-family: inherit; transition: all 0.2s; }
.pb-conf-btn:hover { background: rgba(200,167,106,0.3); color: #fff; }

.pb-layout { display: grid; grid-template-columns: 280px 1fr; gap: 0; max-width: 1400px; margin: 0 auto; }

/* TOC sidebar */
.pb-toc { position: sticky; top: 42px; align-self: start; max-height: calc(100vh - 42px); overflow-y: auto; padding: 2rem 1.5rem; background: rgba(255,246,236,0.6); border-right: 1px solid var(--pb-line); }
.pb-toc-title { font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.3em; color: var(--pb-gold-deep); font-weight: 600; margin-bottom: 1rem; text-transform: uppercase; }
.pb-toc a { display: block; padding: 0.5rem 0.75rem; color: var(--pb-ink-soft); text-decoration: none; font-size: 0.85rem; border-radius: 8px; margin-bottom: 0.15rem; transition: all 0.2s; border-left: 2px solid transparent; line-height: 1.4; }
.pb-toc a:hover, .pb-toc a.active { background: rgba(200,167,106,0.1); color: var(--pb-gold-deep); border-left-color: var(--pb-gold); }
.pb-toc-num { color: var(--pb-gold); font-weight: 700; font-size: 0.75rem; margin-right: 0.4rem; }

.pb-main { padding: 3rem 3rem 5rem; min-width: 0; }

/* Hero */
.pb-hero { background: linear-gradient(135deg, #1a1a2e 0%, #2c2418 100%); color: #fff; padding: 4rem 3rem; border-radius: 28px; margin-bottom: 4rem; position: relative; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.15); }
.pb-hero::before { content: ''; position: absolute; top: -40%; right: -10%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(200,167,106,0.2), rgba(246,214,207,0.08) 40%, transparent 70%); pointer-events: none; }
.pb-hero::after { content: ''; position: absolute; bottom: -30%; left: -10%; width: 360px; height: 360px; background: radial-gradient(circle, rgba(246,214,207,0.12), transparent 70%); pointer-events: none; }
.pb-hero-inner { position: relative; }
.pb-brand { display: flex; align-items: center; gap: 1rem; margin-bottom: 2.5rem; }
.pb-brand-mark { width: 60px; height: 60px; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 2rem; font-weight: 700; color: #fff; box-shadow: 0 8px 24px rgba(200,167,106,0.4); }
.pb-brand-name { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; letter-spacing: 0.25em; color: var(--pb-gold); }
.pb-brand-sub { font-size: 0.82rem; color: rgba(255,246,236,0.5); letter-spacing: 0.15em; margin-top: 0.2rem; }
.pb-hero-title { font-family: var(--font-display); font-size: 2.2rem; font-weight: 600; line-height: 1.4; margin-bottom: 1rem; max-width: 850px; letter-spacing: 0.01em; }
.pb-hero-lead { font-size: 1.05rem; color: rgba(255,246,236,0.78); line-height: 1.85; max-width: 800px; margin-bottom: 2rem; }
.pb-hero-promise { background: rgba(200,167,106,0.1); border: 1px solid rgba(200,167,106,0.25); border-left: 4px solid var(--pb-gold); border-radius: 14px; padding: 1.5rem 1.75rem; max-width: 850px; backdrop-filter: blur(8px); }
.pb-promise-line { font-size: 1rem; line-height: 1.85; color: rgba(255,246,236,0.92); }
.pb-promise-line strong { color: var(--pb-gold); }

/* Section */
.pb-section { background: #fff; border-radius: 24px; padding: 3rem; margin-bottom: 3rem; box-shadow: 0 6px 28px var(--pb-shadow); position: relative; border: 1px solid var(--pb-line); }
.pb-section-num { position: absolute; top: -16px; left: 2rem; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); color: #fff; padding: 0.45rem 1.1rem; border-radius: 10px; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.15em; box-shadow: 0 6px 16px rgba(200,167,106,0.4); font-family: var(--font-display); }
.pb-section-title { font-family: var(--font-display); font-size: 1.9rem; font-weight: 600; color: var(--pb-ink); margin-bottom: 0.5rem; margin-top: 0.5rem; letter-spacing: 0.01em; }
.pb-section-sub { color: var(--pb-ink-soft); font-size: 1rem; margin-bottom: 2.5rem; line-height: 1.7; }
.pb-h3 { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; color: var(--pb-ink); margin: 2rem 0 1rem; letter-spacing: 0.01em; }

/* Figure reference (playbook images) */
.pb-figref { margin: 0 0 2.5rem; border-radius: 18px; overflow: hidden; background: var(--pb-ivory); border: 1px solid var(--pb-line); box-shadow: 0 8px 28px var(--pb-shadow); transition: all 0.3s; }
.pb-figref:hover { box-shadow: 0 14px 40px rgba(168, 136, 78, 0.18); transform: translateY(-2px); }
.pb-figref img { width: 100%; height: auto; display: block; }
.pb-figref figcaption { padding: 0.85rem 1.25rem; background: linear-gradient(180deg, var(--pb-ivory), var(--pb-beige)); color: var(--pb-gold-deep); font-size: 0.85rem; letter-spacing: 0.05em; border-top: 1px solid var(--pb-line); font-weight: 500; }
.pb-figref-hero { margin-bottom: 2rem; }

/* Swatch row */
.pb-swatch-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-top: 1rem; }
.pb-swatch { aspect-ratio: 1/1.2; border-radius: 12px; padding: 0.75rem 0.6rem; display: flex; flex-direction: column; justify-content: flex-end; gap: 0.2rem; border: 1px solid rgba(0,0,0,0.05); color: var(--pb-ink); }
.pb-swatch span { font-size: 0.75rem; font-weight: 600; line-height: 1.2; }
.pb-swatch code { font-size: 0.65rem; font-family: 'Courier New', monospace; opacity: 0.7; }

/* Typography sample */
.pb-type-sample { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 0; }
.pb-type-display { font-family: var(--font-display); font-size: 2.8rem; font-weight: 600; color: var(--pb-gold-deep); line-height: 1; min-width: 60px; text-align: center; }
.pb-type-body { font-family: var(--font-body); font-size: 2.8rem; font-weight: 600; color: var(--pb-ink); line-height: 1; min-width: 60px; text-align: center; }

/* Core Strategy flow */
.pb-flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr; gap: 0.5rem; align-items: center; margin-top: 2rem; }
.pb-flow-card { background: linear-gradient(135deg, var(--pb-ivory), #fff); border: 1.5px solid var(--pb-gold); border-radius: 18px; padding: 1.5rem 1rem; text-align: center; transition: all 0.3s; box-shadow: 0 4px 16px var(--pb-shadow); }
.pb-flow-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(200,167,106,0.2); }
.pb-flow-icon { font-size: 2rem; margin-bottom: 0.75rem; }
.pb-flow-en { font-family: var(--font-display); font-size: 0.9rem; color: var(--pb-gold-deep); font-weight: 600; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
.pb-flow-th { font-size: 0.9rem; color: var(--pb-ink); line-height: 1.6; }
.pb-flow-arrow { color: var(--pb-gold); font-size: 1.5rem; font-weight: 700; }

/* Two col layout */
.pb-twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
.pb-card { padding: 2rem; border-radius: 18px; }
.pb-card-pos { background: linear-gradient(135deg, #f4f9ee, #fbfdf7); border: 1px solid #c8d9b1; }
.pb-card-neg { background: linear-gradient(135deg, #fdf2f0, #fef7f5); border: 1px solid #e8b5b0; }
.pb-card-neutral { background: linear-gradient(135deg, var(--pb-ivory), var(--pb-beige)); border: 1px solid var(--pb-taupe); }
.pb-card-tag { display: inline-block; padding: 0.3rem 0.85rem; background: rgba(255,255,255,0.7); border-radius: 8px; font-size: 0.78rem; font-weight: 700; margin-bottom: 1rem; letter-spacing: 0.1em; }
.pb-card-pos .pb-card-tag { color: #5a7a3e; }
.pb-card-neg .pb-card-tag { color: #a8564e; }
.pb-card h3 { font-family: var(--font-display); font-size: 1.1rem; color: var(--pb-ink); margin-bottom: 1rem; font-weight: 600; }
.pb-card h4 { font-size: 0.95rem; color: var(--pb-ink); margin: 1rem 0 0.5rem; font-weight: 700; }
.pb-card ul { list-style: none; }
.pb-card ul li { padding: 0.4rem 0 0.4rem 1.6rem; position: relative; color: var(--pb-ink); font-size: 0.95rem; line-height: 1.65; }
.pb-card-pos ul li::before { content: '✓'; position: absolute; left: 0; color: #5a7a3e; font-weight: 700; }
.pb-card-neg ul li::before { content: '✗'; position: absolute; left: 0; color: #a8564e; font-weight: 700; }
.pb-card-neutral ul li::before { content: '•'; position: absolute; left: 0; color: var(--pb-gold-deep); font-weight: 700; }

/* Callouts */
.pb-callout { padding: 1.5rem 1.75rem; border-radius: 16px; margin: 1.5rem 0; }
.pb-callout-gold { background: linear-gradient(135deg, var(--pb-ivory), var(--pb-beige)); border-left: 5px solid var(--pb-gold); }
.pb-callout-dark { background: linear-gradient(135deg, #2a2417, #1a1a2e); color: #fff; border-left: 5px solid var(--pb-gold); }
.pb-callout-dark strong { color: var(--pb-gold); }
.pb-callout-title { font-weight: 700; color: var(--pb-gold-deep); margin-bottom: 0.75rem; font-size: 1.05rem; font-family: var(--font-display); }
.pb-callout-dark p { color: rgba(255,246,236,0.85); margin-top: 0.5rem; line-height: 1.75; }

/* Tags */
.pb-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.pb-tag { background: rgba(200,167,106,0.12); color: var(--pb-gold-deep); padding: 0.4rem 0.9rem; border-radius: 100px; font-size: 0.85rem; font-weight: 500; border: 1px solid rgba(200,167,106,0.3); }
.pb-tag-bad { background: rgba(168,86,78,0.08); color: #a8564e; border-color: rgba(168,86,78,0.25); text-decoration: line-through; }

/* Pillars */
.pb-pillars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
.pb-pillar { background: #fff; border: 1px solid var(--pb-line); border-radius: 18px; overflow: hidden; transition: all 0.3s; }
.pb-pillar:hover { transform: translateY(-4px); box-shadow: 0 16px 40px var(--pb-shadow); border-color: var(--pb-gold); }
.pb-pillar-head { background: linear-gradient(135deg, var(--pb-ivory), var(--pb-beige)); padding: 1.5rem; border-bottom: 1px solid var(--pb-line); position: relative; }
.pb-pillar-num { position: absolute; top: 1rem; right: 1rem; width: 34px; height: 34px; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; font-family: var(--font-display); }
.pb-pillar-icon { font-size: 2rem; margin-bottom: 0.5rem; }
.pb-pillar h3 { font-family: var(--font-display); font-size: 1.25rem; color: var(--pb-ink); font-weight: 600; margin-bottom: 0.4rem; }
.pb-pillar-role { color: var(--pb-ink-soft); font-size: 0.9rem; }
.pb-pillar-body { padding: 1.5rem; }
.pb-pillar-body h4 { font-size: 0.82rem; color: var(--pb-gold-deep); letter-spacing: 0.12em; font-weight: 700; margin-bottom: 0.75rem; text-transform: uppercase; }
.pb-pillar-body ul { list-style: none; margin-bottom: 1.25rem; }
.pb-pillar-body ul li { padding: 0.35rem 0 0.35rem 1.3rem; position: relative; color: var(--pb-ink); font-size: 0.92rem; line-height: 1.55; }
.pb-pillar-body ul li::before { content: '▸'; position: absolute; left: 0; color: var(--pb-gold); }
.pb-funnel { background: var(--pb-ivory); padding: 1rem 1.1rem; border-radius: 12px; font-size: 0.88rem; color: var(--pb-ink); line-height: 1.55; border-left: 3px solid var(--pb-gold); }
.pb-funnel-label { display: block; color: var(--pb-gold-deep); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.12em; margin-bottom: 0.25rem; text-transform: uppercase; }

.pb-tier-mini { display: flex; flex-direction: column; gap: 0.5rem; margin: 1rem 0; }
.pb-tier-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem 0.8rem; background: var(--pb-ivory); border-radius: 10px; }
.pb-tier-badge { padding: 0.22rem 0.7rem; border-radius: 6px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; color: #fff; }
.pb-tier-1 { background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); }
.pb-tier-2 { background: linear-gradient(135deg, #8a9bb8, #5d6e8a); }
.pb-tier-3 { background: linear-gradient(135deg, #b5a78a, #8e7e60); }
.pb-formula { background: #1a1a2e; color: var(--pb-gold); padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.9rem; text-align: center; margin-top: 1rem; }
.pb-formula strong { color: #fff; }
.pb-italic { font-style: italic; color: var(--pb-ink-soft); line-height: 1.75; margin-bottom: 1rem; }
.pb-warning { background: rgba(168,86,78,0.06); border-left: 3px solid #a8564e; padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.85rem; color: #6b3d39; margin-top: 1rem; line-height: 1.65; }

/* Compare */
.pb-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.pb-compare-bad, .pb-compare-good { padding: 1.5rem; border-radius: 16px; }
.pb-compare-bad { background: linear-gradient(135deg, #fdf2f0, #fef7f5); border: 1px solid #e8b5b0; }
.pb-compare-good { background: linear-gradient(135deg, #f4f9ee, #fbfdf7); border: 1px solid #c8d9b1; }
.pb-compare-head { font-weight: 700; margin-bottom: 0.75rem; }
.pb-compare-bad .pb-compare-head { color: #a8564e; }
.pb-compare-good .pb-compare-head { color: #5a7a3e; }

/* Mini cards */
.pb-mini-card { background: linear-gradient(135deg, var(--pb-ivory), var(--pb-beige)); border: 1px solid var(--pb-taupe); padding: 1.75rem; border-radius: 16px; }
.pb-mini-card h3 { font-family: var(--font-display); color: var(--pb-ink); font-size: 1.15rem; margin-bottom: 0.5rem; font-weight: 600; }
.pb-mini-desc { color: var(--pb-ink-soft); font-size: 0.9rem; margin-bottom: 1rem; }
.pb-mini-card ul { list-style: none; }
.pb-mini-card ul li { padding: 0.3rem 0 0.3rem 1.1rem; position: relative; color: var(--pb-ink); font-size: 0.92rem; }
.pb-mini-card ul li::before { content: '•'; position: absolute; left: 0; color: var(--pb-gold); font-weight: 700; }

/* Examples */
.pb-examples { display: flex; flex-direction: column; gap: 0.75rem; margin: 1rem 0; }
.pb-example { background: var(--pb-ivory); padding: 1rem 1.25rem; border-radius: 12px; border-left: 3px solid var(--pb-gold); }
.pb-example-title { font-weight: 600; color: var(--pb-ink); margin-bottom: 0.4rem; font-size: 0.95rem; }
.pb-example-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.pb-pri, .pb-sec { padding: 0.22rem 0.7rem; border-radius: 6px; font-size: 0.78rem; font-weight: 600; }
.pb-pri { background: rgba(200,167,106,0.18); color: var(--pb-gold-deep); }
.pb-sec { background: rgba(139,116,82,0.12); color: #6b5e48; }

/* Fields / Table */
.pb-fields { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0 2rem; }
.pb-field { background: #1a1a2e; color: var(--pb-gold); padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; }
.pb-table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--pb-line); }
.pb-table { width: 100%; border-collapse: collapse; background: #fff; }
.pb-table th { background: linear-gradient(135deg, #1a1a2e, #2c2418); color: var(--pb-gold); padding: 0.85rem 1rem; text-align: left; font-size: 0.85rem; letter-spacing: 0.08em; font-family: var(--font-display); font-weight: 600; }
.pb-table td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--pb-line); font-size: 0.9rem; color: var(--pb-ink); }
.pb-table tr:nth-child(even) td { background: var(--pb-ivory); }

/* Checklist */
.pb-checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 1.5rem 0; }
.pb-check-item { background: var(--pb-ivory); padding: 1rem 1.25rem 1rem 3rem; border-radius: 12px; position: relative; color: var(--pb-ink); font-size: 0.95rem; line-height: 1.55; border: 1px solid var(--pb-line); }
.pb-check-item::before { content: '?'; position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }

/* Templates */

function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
}

async function deriveKey(password, salt, iter) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
    return await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' },
        baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
}

async function unlock() {
    const pw = document.getElementById('pwInput').value;
    const err = document.getElementById('lockError');
    const btn = document.getElementById('unlockBtn');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'กำลังถอดรหัส...';
    try {
        const salt = b64ToBytes(PB_DATA.salt);
        const iv = b64ToBytes(PB_DATA.iv);
        const cipherWithTag = b64ToBytes(PB_DATA.blob);
        const key = await deriveKey(pw, salt, PB_DATA.iter);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, cipherWithTag);
        renderPlaybook(new TextDecoder().decode(plain));
    } catch (e) {
        err.textContent = '❌ รหัสผ่านไม่ถูกต้อง';
        btn.disabled = false;
        btn.textContent = 'ปลดล็อก';
        document.getElementById('pwInput').value = '';
    }
}

function renderPlaybook(html) {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('pbMain').innerHTML = html;
    document.getElementById('pbContainer').classList.add('active');
    buildTOC();
    setupTocActive();
    window.scrollTo({ top: 0, behavior: 'instant' });
    document.getElementById('pwInput').value = '';
}

function buildTOC() {
    const toc = document.getElementById('pbToc');
    document.querySelectorAll('#pbMain .pb-section').forEach((sec, i) => {
        const title = sec.querySelector('.pb-section-title')?.textContent || 'Section';
        const num = sec.querySelector('.pb-section-num')?.textContent || (i+1);
        const a = document.createElement('a');
        a.href = '#' + sec.id;
        a.innerHTML = '<span class="pb-toc-num">' + num + '</span> ' + title;
        toc.appendChild(a);
    });
}

function setupTocActive() {
    const tocLinks = document.querySelectorAll('.pb-toc a');
    const sections = document.querySelectorAll('#pbMain .pb-section');
    const obs = new IntersectionObserver((entries) => {
        entries.forEach(en => {
            if (en.isIntersecting) {
                const id = en.target.id;
                tocLinks.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + id));
            }
        });
    }, { rootMargin: '-30% 0px -60% 0px' });
    sections.forEach(s => obs.observe(s));
}

function lockAgain() {
    document.getElementById('pbContainer').classList.remove('active');
    document.getElementById('pbMain').innerHTML = '';
    document.getElementById('pbToc').innerHTML = '<div class="pb-toc-title">CONTENTS</div>';
    document.getElementById('lockScreen').style.display = 'flex';
    document.getElementById('unlockBtn').disabled = false;
    document.getElementById('unlockBtn').textContent = 'ปลดล็อก';
    document.getElementById('lockError').textContent = '';
    setTimeout(() => document.getElementById('pwInput').focus(), 100);
}
