<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Internal Document · Paragon</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Sukhumvit Set', 'IBM Plex Sans Thai', sans-serif; -webkit-font-smoothing: antialiased; color: #2c3e50; }
body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; }

/* ============ LOCK SCREEN ============ */
.lock-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.lock-card { background: rgba(255,255,255,0.06); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; padding: 3rem 2.5rem; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,0.4); }
.lock-icon { width: 80px; height: 80px; margin: 0 auto 1.5rem; background: linear-gradient(135deg, #E6B030, #C9A020); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: #fff; box-shadow: 0 12px 32px rgba(230,176,48,0.4); }
.lock-brand { color: #E6B030; font-size: 0.8rem; letter-spacing: 0.3em; font-weight: 700; margin-bottom: 0.5rem; }
.lock-title { color: #fff; font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
.lock-sub { color: rgba(255,255,255,0.6); font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.6; }
.lock-form { display: flex; flex-direction: column; gap: 1rem; }
.lock-input { width: 100%; padding: 1rem 1.25rem; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; color: #fff; font-size: 1rem; font-family: inherit; outline: none; transition: all 0.3s; }
.lock-input:focus { border-color: #E6B030; background: rgba(255,255,255,0.12); }
.lock-input::placeholder { color: rgba(255,255,255,0.4); }
.lock-btn { padding: 1rem; background: linear-gradient(135deg, #E6B030, #C9A020); color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; font-family: inherit; }
.lock-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(230,176,48,0.5); }
.lock-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.lock-error { color: #ff6b6b; font-size: 0.9rem; min-height: 1.2rem; margin-top: 0.25rem; }
.lock-confidential { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); font-size: 0.75rem; letter-spacing: 0.1em; }

/* ============ PLAYBOOK ============ */
.pb-container { display: none; min-height: 100vh; background: linear-gradient(180deg, #fffbf0 0%, #fff 100%); }
.pb-container.active { display: block; }

.pb-confidential-bar { background: linear-gradient(135deg, #1a1a2e, #0f3460); color: #E6B030; padding: 0.5rem 2rem; text-align: center; font-size: 0.75rem; letter-spacing: 0.2em; font-weight: 700; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
.pb-conf-actions { display: flex; gap: 0.75rem; }
.pb-conf-btn { background: rgba(230,176,48,0.15); border: 1px solid rgba(230,176,48,0.3); color: #E6B030; padding: 0.25rem 0.75rem; border-radius: 6px; font-size: 0.7rem; cursor: pointer; letter-spacing: 0.1em; font-family: inherit; }
.pb-conf-btn:hover { background: rgba(230,176,48,0.3); }

.pb-layout { display: grid; grid-template-columns: 280px 1fr; gap: 0; max-width: 1400px; margin: 0 auto; }

/* TOC sidebar */
.pb-toc { position: sticky; top: 40px; align-self: start; max-height: calc(100vh - 40px); overflow-y: auto; padding: 2rem 1.5rem; background: rgba(255,255,255,0.5); border-right: 1px solid rgba(230,176,48,0.15); }
.pb-toc-title { font-size: 0.7rem; letter-spacing: 0.25em; color: #C9A020; font-weight: 700; margin-bottom: 1rem; }
.pb-toc a { display: block; padding: 0.5rem 0.75rem; color: #5c6b7a; text-decoration: none; font-size: 0.85rem; border-radius: 8px; margin-bottom: 0.15rem; transition: all 0.2s; border-left: 2px solid transparent; }
.pb-toc a:hover, .pb-toc a.active { background: rgba(230,176,48,0.1); color: #C9A020; border-left-color: #E6B030; }
.pb-toc-num { color: #E6B030; font-weight: 700; font-size: 0.75rem; margin-right: 0.4rem; }

.pb-main { padding: 3rem 3rem 5rem; min-width: 0; }

/* Hero */
.pb-hero { background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%); color: #fff; padding: 4rem 3rem; border-radius: 24px; margin-bottom: 4rem; position: relative; overflow: hidden; }
.pb-hero::before { content: ''; position: absolute; top: -50%; right: -20%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(230,176,48,0.15), transparent 70%); pointer-events: none; }
.pb-hero-inner { position: relative; }
.pb-brand { display: flex; align-items: center; gap: 1rem; margin-bottom: 2.5rem; }
.pb-brand-mark { width: 56px; height: 56px; background: linear-gradient(135deg, #E6B030, #C9A020); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 700; color: #1a1a2e; }
.pb-brand-name { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.2em; color: #E6B030; }
.pb-brand-sub { font-size: 0.85rem; color: rgba(255,255,255,0.5); letter-spacing: 0.1em; }
.pb-hero-title { font-size: 2rem; font-weight: 700; line-height: 1.4; margin-bottom: 1rem; max-width: 850px; }
.pb-hero-lead { font-size: 1.05rem; color: rgba(255,255,255,0.7); line-height: 1.8; max-width: 800px; margin-bottom: 2rem; }
.pb-hero-promise { background: rgba(230,176,48,0.08); border-left: 4px solid #E6B030; border-radius: 8px; padding: 1.5rem 1.75rem; max-width: 850px; }
.pb-promise-line { font-size: 1rem; line-height: 1.8; color: rgba(255,255,255,0.92); }
.pb-promise-line strong { color: #E6B030; }

/* Section */
.pb-section { background: #fff; border-radius: 20px; padding: 3rem; margin-bottom: 3rem; box-shadow: 0 4px 20px rgba(0,0,0,0.04); position: relative; }
.pb-section-num { position: absolute; top: -16px; left: 2rem; background: linear-gradient(135deg, #E6B030, #C9A020); color: #fff; padding: 0.4rem 1rem; border-radius: 8px; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.1em; box-shadow: 0 4px 12px rgba(230,176,48,0.3); }
.pb-section-title { font-size: 1.85rem; font-weight: 700; color: #1a1a2e; margin-bottom: 0.5rem; margin-top: 0.5rem; }
.pb-section-sub { color: #6c757d; font-size: 1rem; margin-bottom: 2.5rem; line-height: 1.6; }
.pb-h3 { font-size: 1.15rem; font-weight: 700; color: #2c3e50; margin: 2rem 0 1rem; }

/* Core Strategy flow */
.pb-flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr; gap: 0.5rem; align-items: center; margin-top: 2rem; }
.pb-flow-card { background: linear-gradient(135deg, #fffaf0, #fff5e0); border: 2px solid #E6B030; border-radius: 16px; padding: 1.5rem 1rem; text-align: center; transition: transform 0.3s; }
.pb-flow-card:hover { transform: translateY(-4px); }
.pb-flow-icon { font-size: 2rem; margin-bottom: 0.75rem; }
.pb-flow-en { font-size: 0.85rem; color: #C9A020; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
.pb-flow-th { font-size: 0.9rem; color: #2c3e50; line-height: 1.5; }
.pb-flow-arrow { color: #E6B030; font-size: 1.5rem; font-weight: 700; }

/* Two col layout */
.pb-twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
.pb-card { padding: 2rem; border-radius: 16px; }
.pb-card-pos { background: linear-gradient(135deg, #f0fdf4, #dcfce7); border: 1px solid #86efac; }
.pb-card-neg { background: linear-gradient(135deg, #fef2f2, #fee2e2); border: 1px solid #fca5a5; }
.pb-card-neutral { background: linear-gradient(135deg, #fffaf0, #fff5e0); border: 1px solid #fcd34d; }
.pb-card-tag { display: inline-block; padding: 0.3rem 0.75rem; background: rgba(255,255,255,0.6); border-radius: 6px; font-size: 0.8rem; font-weight: 700; margin-bottom: 1rem; letter-spacing: 0.05em; }
.pb-card-pos .pb-card-tag { color: #15803d; }
.pb-card-neg .pb-card-tag { color: #b91c1c; }
.pb-card h3 { font-size: 1.05rem; color: #1a1a2e; margin-bottom: 1rem; font-weight: 700; }
.pb-card h4 { font-size: 0.95rem; color: #2c3e50; margin: 1rem 0 0.5rem; font-weight: 700; }
.pb-card ul { list-style: none; }
.pb-card ul li { padding: 0.4rem 0 0.4rem 1.5rem; position: relative; color: #2c3e50; font-size: 0.95rem; line-height: 1.6; }
.pb-card-pos ul li::before { content: '✓'; position: absolute; left: 0; color: #16a34a; font-weight: 700; }
.pb-card-neg ul li::before { content: '✗'; position: absolute; left: 0; color: #dc2626; font-weight: 700; }
.pb-card-neutral ul li::before { content: '•'; position: absolute; left: 0; color: #C9A020; font-weight: 700; }

/* Callouts */
.pb-callout { padding: 1.5rem 1.75rem; border-radius: 14px; margin: 1.5rem 0; }
.pb-callout-gold { background: linear-gradient(135deg, #fffaf0, #fff5e0); border-left: 5px solid #E6B030; }
.pb-callout-dark { background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff; border-left: 5px solid #E6B030; }
.pb-callout-dark strong { color: #E6B030; }
.pb-callout-title { font-weight: 700; color: #C9A020; margin-bottom: 0.75rem; font-size: 1.05rem; }
.pb-callout-dark p { color: rgba(255,255,255,0.85); margin-top: 0.5rem; line-height: 1.7; }

/* Tags */
.pb-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.pb-tag { background: rgba(230,176,48,0.12); color: #C9A020; padding: 0.4rem 0.85rem; border-radius: 20px; font-size: 0.85rem; font-weight: 500; border: 1px solid rgba(230,176,48,0.25); }
.pb-tag-bad { background: rgba(220,38,38,0.08); color: #b91c1c; border-color: rgba(220,38,38,0.2); text-decoration: line-through; }

/* Pillars */
.pb-pillars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
.pb-pillar { background: #fff; border: 1px solid #f0e6c8; border-radius: 16px; overflow: hidden; transition: all 0.3s; }
.pb-pillar:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(230,176,48,0.12); }
.pb-pillar-head { background: linear-gradient(135deg, #fffaf0, #fff5e0); padding: 1.5rem; border-bottom: 1px solid #f0e6c8; position: relative; }
.pb-pillar-num { position: absolute; top: 1rem; right: 1rem; width: 32px; height: 32px; background: linear-gradient(135deg, #E6B030, #C9A020); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; }
.pb-pillar-icon { font-size: 2rem; margin-bottom: 0.5rem; }
.pb-pillar h3 { font-size: 1.2rem; color: #1a1a2e; font-weight: 700; margin-bottom: 0.4rem; }
.pb-pillar-role { color: #6c757d; font-size: 0.9rem; }
.pb-pillar-body { padding: 1.5rem; }
.pb-pillar-body h4 { font-size: 0.85rem; color: #C9A020; letter-spacing: 0.05em; font-weight: 700; margin-bottom: 0.75rem; text-transform: uppercase; }
.pb-pillar-body ul { list-style: none; margin-bottom: 1.25rem; }
.pb-pillar-body ul li { padding: 0.35rem 0 0.35rem 1.25rem; position: relative; color: #2c3e50; font-size: 0.9rem; line-height: 1.5; }
.pb-pillar-body ul li::before { content: '▸'; position: absolute; left: 0; color: #E6B030; }
.pb-funnel { background: #f8f9fa; padding: 1rem; border-radius: 10px; font-size: 0.88rem; color: #2c3e50; line-height: 1.5; border-left: 3px solid #E6B030; }
.pb-funnel-label { display: block; color: #C9A020; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.1em; margin-bottom: 0.25rem; text-transform: uppercase; }

.pb-tier-mini { display: flex; flex-direction: column; gap: 0.5rem; margin: 1rem 0; }
.pb-tier-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0.75rem; background: #fffaf0; border-radius: 8px; }
.pb-tier-badge { padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; color: #fff; }
.pb-tier-1 { background: linear-gradient(135deg, #E6B030, #C9A020); }
.pb-tier-2 { background: linear-gradient(135deg, #3b82f6, #2563eb); }
.pb-tier-3 { background: linear-gradient(135deg, #16a34a, #15803d); }
.pb-formula { background: #1a1a2e; color: #E6B030; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.9rem; text-align: center; margin-top: 1rem; }
.pb-formula strong { color: #fff; }
.pb-italic { font-style: italic; color: #6c757d; line-height: 1.7; margin-bottom: 1rem; }
.pb-warning { background: rgba(220,38,38,0.06); border-left: 3px solid #dc2626; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.85rem; color: #7f1d1d; margin-top: 1rem; line-height: 1.6; }

/* Compare */
.pb-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.pb-compare-bad, .pb-compare-good { padding: 1.5rem; border-radius: 14px; }
.pb-compare-bad { background: linear-gradient(135deg, #fef2f2, #fee2e2); border: 1px solid #fca5a5; }
.pb-compare-good { background: linear-gradient(135deg, #f0fdf4, #dcfce7); border: 1px solid #86efac; }
.pb-compare-head { font-weight: 700; margin-bottom: 0.75rem; }
.pb-compare-bad .pb-compare-head { color: #b91c1c; }
.pb-compare-good .pb-compare-head { color: #15803d; }

/* Mini cards */
.pb-mini-card { background: linear-gradient(135deg, #fffaf0, #fff5e0); border: 1px solid #fcd34d; padding: 1.5rem; border-radius: 14px; }
.pb-mini-card h3 { color: #1a1a2e; font-size: 1.1rem; margin-bottom: 0.5rem; }
.pb-mini-desc { color: #6c757d; font-size: 0.9rem; margin-bottom: 1rem; }
.pb-mini-card ul { list-style: none; }
.pb-mini-card ul li { padding: 0.3rem 0 0.3rem 1rem; position: relative; color: #2c3e50; font-size: 0.92rem; }
.pb-mini-card ul li::before { content: '•'; position: absolute; left: 0; color: #E6B030; font-weight: 700; }

/* Examples */
.pb-examples { display: flex; flex-direction: column; gap: 0.75rem; margin: 1rem 0; }
.pb-example { background: #f8f9fa; padding: 1rem 1.25rem; border-radius: 10px; border-left: 3px solid #E6B030; }
.pb-example-title { font-weight: 600; color: #1a1a2e; margin-bottom: 0.4rem; font-size: 0.95rem; }
.pb-example-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.pb-pri, .pb-sec { padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.78rem; font-weight: 600; }
.pb-pri { background: rgba(230,176,48,0.15); color: #C9A020; }
.pb-sec { background: rgba(99,102,241,0.1); color: #4338ca; }

/* Fields / Table */
.pb-fields { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0 2rem; }
.pb-field { background: #1a1a2e; color: #E6B030; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; }
.pb-table-wrap { overflow-x: auto; border-radius: 12px; }
.pb-table { width: 100%; border-collapse: collapse; background: #fff; }
.pb-table th { background: linear-gradient(135deg, #1a1a2e, #0f3460); color: #E6B030; padding: 0.75rem 1rem; text-align: left; font-size: 0.85rem; letter-spacing: 0.05em; }
.pb-table td { padding: 0.75rem 1rem; border-bottom: 1px solid #f0e6c8; font-size: 0.9rem; color: #2c3e50; }
.pb-table tr:nth-child(even) td { background: #fffaf0; }

/* Checklist */
.pb-checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 1.5rem 0; }
.pb-check-item { background: #fffaf0; padding: 1rem 1.25rem 1rem 3rem; border-radius: 10px; position: relative; color: #2c3e50; font-size: 0.95rem; line-height: 1.5; border: 1px solid #f0e6c8; }
.pb-check-item::before { content: '?'; position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; background: #E6B030; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }

/* Templates */
.pb-templates { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
.pb-template { background: linear-gradient(135deg, #fff, #fffaf0); border: 1px solid #f0e6c8; border-radius: 16px; padding: 1.75rem; position: relative; transition: all 0.3s; }
.pb-template:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(230,176,48,0.12); }
.pb-template-num { position: absolute; top: 1rem; right: 1rem; background: linear-gradient(135deg, #1a1a2e, #0f3460); color: #E6B030; padding: 0.3rem 0.7rem; border-radius: 6px; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.05em; }
.pb-template h3 { font-size: 1.15rem; color: #1a1a2e; margin-bottom: 0.5rem; padding-right: 3rem; }
.pb-template-role { color: #6c757d; font-size: 0.9rem; margin-bottom: 1rem; line-height: 1.6; }
.pb-template-fit, .pb-template-kpi { font-size: 0.85rem; color: #2c3e50; padding: 0.6rem 0.9rem; background: #f8f9fa; border-radius: 8px; margin-top: 0.5rem; line-height: 1.5; }
.pb-template-fit strong, .pb-template-kpi strong { color: #C9A020; }
.pb-template-warn { background: rgba(220,38,38,0.06); border-left: 3px solid #dc2626; padding: 0.6rem 0.9rem; border-radius: 8px; font-size: 0.85rem; color: #7f1d1d; margin-top: 0.75rem; }

/* List */
.pb-list { list-style: none; margin: 1rem 0; }
.pb-list li { padding: 0.5rem 0 0.5rem 1.75rem; position: relative; color: #2c3e50; line-height: 1.6; }
.pb-list li::before { content: '✦'; position: absolute; left: 0; color: #E6B030; font-weight: 700; }
.pb-numbered { list-style: none; counter-reset: numlist; margin: 1rem 0; }
.pb-numbered li { padding: 0.5rem 0 0.5rem 2.5rem; position: relative; color: #2c3e50; line-height: 1.6; counter-increment: numlist; }
.pb-numbered li::before { content: counter(numlist); position: absolute; left: 0; top: 0.5rem; width: 28px; height: 28px; background: linear-gradient(135deg, #E6B030, #C9A020); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }

/* Formula box */
.pb-formula-box { background: linear-gradient(135deg, #1a1a2e, #0f3460); color: #fff; padding: 1.5rem; border-radius: 14px; margin: 1.5rem 0; }
.pb-formula-title { color: #E6B030; font-size: 0.85rem; letter-spacing: 0.15em; font-weight: 700; margin-bottom: 1rem; text-transform: uppercase; }
.pb-formula-flow { font-size: 0.95rem; line-height: 1.8; color: rgba(255,255,255,0.9); }
.pb-formula-flow span { background: rgba(230,176,48,0.15); padding: 0.3rem 0.7rem; border-radius: 6px; color: #E6B030; font-weight: 600; display: inline-block; margin: 0.2rem 0; }

/* Quote */
.pb-quote { background: linear-gradient(135deg, #fffaf0, #fff5e0); border-left: 5px solid #E6B030; padding: 2rem 2rem 2rem 4rem; border-radius: 14px; margin: 1.5rem 0; position: relative; }
.pb-quote-mark { position: absolute; top: 0.5rem; left: 1rem; font-size: 3rem; color: #E6B030; opacity: 0.4; font-family: Georgia, serif; }
.pb-quote p { color: #2c3e50; line-height: 1.8; margin-bottom: 0.75rem; }
.pb-quote p:last-child { margin-bottom: 0; }

/* Rules */
.pb-rule-box { background: #fffaf0; border: 2px dashed #E6B030; padding: 1.5rem; border-radius: 14px; margin-top: 1.5rem; }
.pb-rule-box strong { color: #C9A020; display: block; margin-bottom: 0.75rem; font-size: 1rem; }
.pb-rule-box ul { list-style: none; margin-top: 0.75rem; }
.pb-rule-box ul li { padding: 0.35rem 0 0.35rem 1.5rem; position: relative; color: #2c3e50; }
.pb-rule-box ul li::before { content: '→'; position: absolute; left: 0; color: #E6B030; font-weight: 700; }
.pb-rule-tight { background: linear-gradient(135deg, #fef2f2, #fee2e2); border-left: 4px solid #dc2626; padding: 0.85rem 1.25rem; border-radius: 8px; margin-top: 1rem; color: #7f1d1d; font-size: 0.95rem; }

/* Tone */
.pb-tone { margin: 1.5rem 0; }
.pb-tone-title { font-weight: 700; color: #C9A020; margin-bottom: 0.75rem; }

/* Script */
.pb-script { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1rem 0; }
.pb-script-bad, .pb-script-good { padding: 1.25rem; border-radius: 12px; line-height: 1.7; }
.pb-script-bad { background: linear-gradient(135deg, #fef2f2, #fee2e2); border: 1px solid #fca5a5; }
.pb-script-good { background: linear-gradient(135deg, #f0fdf4, #dcfce7); border: 1px solid #86efac; }
.pb-script-label { font-weight: 700; margin-bottom: 0.5rem; font-size: 0.85rem; }
.pb-script-bad .pb-script-label { color: #b91c1c; }
.pb-script-good .pb-script-label { color: #15803d; }
.pb-script-good { grid-column: span 1; }
.pb-script + .pb-script-good { margin: 1rem 0; }

/* Steps */
.pb-steps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin-top: 1.5rem; }
.pb-step { background: linear-gradient(135deg, #fff, #fffaf0); border: 1px solid #f0e6c8; border-radius: 16px; padding: 1.75rem; position: relative; }
.pb-step-num { position: absolute; top: -16px; left: 1.5rem; width: 36px; height: 36px; background: linear-gradient(135deg, #E6B030, #C9A020); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; box-shadow: 0 4px 12px rgba(230,176,48,0.4); }
.pb-step h3 { font-size: 1.1rem; color: #1a1a2e; margin: 0.5rem 0 1rem; font-weight: 700; }
.pb-step ul { list-style: none; }
.pb-step ul li { padding: 0.35rem 0 0.35rem 1.5rem; position: relative; color: #2c3e50; font-size: 0.92rem; line-height: 1.5; }
.pb-step ul li::before { content: '✓'; position: absolute; left: 0; color: #16a34a; font-weight: 700; }

/* Weeks */
.pb-weeks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-top: 1.5rem; }
.pb-week { background: linear-gradient(180deg, #fff, #fffaf0); border: 1px solid #f0e6c8; border-radius: 14px; padding: 1.5rem; }
.pb-week-tag { display: inline-block; background: linear-gradient(135deg, #1a1a2e, #0f3460); color: #E6B030; padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 0.75rem; }
.pb-week h3 { font-size: 1.05rem; color: #1a1a2e; margin-bottom: 0.5rem; }
.pb-week-goal { color: #2c3e50; font-size: 0.9rem; line-height: 1.5; margin-bottom: 0.75rem; }
.pb-week h4 { font-size: 0.8rem; color: #C9A020; letter-spacing: 0.05em; font-weight: 700; margin: 0.75rem 0 0.5rem; text-transform: uppercase; }
.pb-week ul { list-style: none; margin-bottom: 1rem; }
.pb-week ul li { padding: 0.25rem 0 0.25rem 1rem; position: relative; color: #2c3e50; font-size: 0.85rem; line-height: 1.5; }
.pb-week ul li::before { content: '▸'; position: absolute; left: 0; color: #E6B030; }
.pb-week-output { background: rgba(230,176,48,0.08); padding: 0.6rem 0.85rem; border-radius: 8px; font-size: 0.82rem; line-height: 1.5; color: #2c3e50; border-left: 3px solid #E6B030; }
.pb-week-output strong { color: #C9A020; }

/* Phases */
.pb-phases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 1.5rem; }
.pb-phase { background: #fff; border: 1px solid #f0e6c8; border-radius: 14px; padding: 1.75rem; position: relative; overflow: hidden; }
.pb-phase::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #E6B030, #C9A020); }
.pb-phase-tag { display: inline-block; background: linear-gradient(135deg, #1a1a2e, #0f3460); color: #E6B030; padding: 0.4rem 0.85rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 0.75rem; }
.pb-phase h3 { font-size: 1.2rem; color: #1a1a2e; margin-bottom: 1rem; }
.pb-phase h4 { font-size: 0.8rem; color: #C9A020; letter-spacing: 0.1em; font-weight: 700; margin: 1rem 0 0.5rem; text-transform: uppercase; }
.pb-phase ul { list-style: none; }
.pb-phase ul li { padding: 0.3rem 0 0.3rem 1.25rem; position: relative; color: #2c3e50; font-size: 0.9rem; line-height: 1.5; }
.pb-phase ul li::before { content: '•'; position: absolute; left: 0; color: #E6B030; font-weight: 700; }

/* KPIs */
.pb-kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
.pb-kpi { background: linear-gradient(135deg, #fff, #fffaf0); border: 1px solid #f0e6c8; border-radius: 14px; padding: 1.75rem; }
.pb-kpi h3 { font-size: 1.1rem; color: #1a1a2e; margin-bottom: 0.5rem; }
.pb-kpi-sub { color: #6c757d; font-size: 0.85rem; margin-bottom: 1rem; }
.pb-kpi h4 { font-size: 0.8rem; color: #C9A020; letter-spacing: 0.05em; font-weight: 700; margin: 1rem 0 0.5rem; text-transform: uppercase; }
.pb-kpi ul { list-style: none; }
.pb-kpi ul li { padding: 0.3rem 0 0.3rem 1.25rem; position: relative; color: #2c3e50; font-size: 0.88rem; line-height: 1.5; }
.pb-kpi ul li::before { content: '▸'; position: absolute; left: 0; color: #E6B030; }

/* Roles */
.pb-roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
.pb-role { background: linear-gradient(135deg, #fff, #fffaf0); border: 1px solid #f0e6c8; border-radius: 14px; padding: 1.5rem; text-align: left; transition: all 0.3s; }
.pb-role:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(230,176,48,0.12); }
.pb-role-icon { font-size: 2rem; margin-bottom: 0.5rem; }
.pb-role h3 { font-size: 1.05rem; color: #1a1a2e; margin-bottom: 0.75rem; }
.pb-role ul { list-style: none; }
.pb-role ul li { padding: 0.3rem 0 0.3rem 1.25rem; position: relative; color: #2c3e50; font-size: 0.85rem; line-height: 1.5; }
.pb-role ul li::before { content: '▸'; position: absolute; left: 0; color: #E6B030; }

/* Principle */
.pb-principle { background: linear-gradient(135deg, #1a1a2e, #0f3460); color: #fff; padding: 2rem 2.5rem; border-radius: 16px; margin-bottom: 1.5rem; text-align: center; }
.pb-principle p { font-size: 1.05rem; line-height: 1.8; color: rgba(255,255,255,0.85); margin-bottom: 0.5rem; }
.pb-principle-bold { font-size: 1.25rem !important; color: #E6B030 !important; font-weight: 700; }
.pb-principle-alt { background: linear-gradient(135deg, #C9A020, #E6B030); }
.pb-principle-alt p { color: rgba(255,255,255,0.95); }
.pb-principle-alt .pb-principle-bold { color: #fff !important; }

/* Final summary */
.pb-final-intro { font-size: 1.1rem; color: #2c3e50; line-height: 1.7; margin-bottom: 2rem; text-align: center; }
.pb-final-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
.pb-final-card { background: linear-gradient(135deg, #1a1a2e, #0f3460); color: #fff; padding: 1.5rem 1rem; border-radius: 14px; text-align: center; position: relative; overflow: hidden; }
.pb-final-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #E6B030, #C9A020); }
.pb-final-en { color: #E6B030; font-weight: 700; letter-spacing: 0.1em; font-size: 0.95rem; margin-bottom: 0.4rem; }
.pb-final-th { color: rgba(255,255,255,0.85); font-size: 0.95rem; }
.pb-final-quote { background: linear-gradient(135deg, #fffaf0, #fff5e0); border: 2px solid #E6B030; border-radius: 16px; padding: 2rem 2.5rem 2rem 4rem; position: relative; margin-top: 1.5rem; }
.pb-final-quote p { font-size: 1.05rem; color: #2c3e50; line-height: 1.8; margin-bottom: 0.75rem; }
.pb-final-quote p:last-child { margin-bottom: 0; }
.pb-final-quote strong { color: #C9A020; }

/* Tier cards (appendix) */
.pb-tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin: 1.5rem 0; }
.pb-tier-card { background: #fff; border-radius: 16px; padding: 1.75rem; position: relative; overflow: hidden; border-top: 5px solid #E6B030; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
.pb-tier-card-1 { border-top-color: #E6B030; }
.pb-tier-card-2 { border-top-color: #3b82f6; }
.pb-tier-card-3 { border-top-color: #16a34a; }
.pb-tier-num { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.15em; margin-bottom: 0.5rem; }
.pb-tier-card-1 .pb-tier-num { color: #C9A020; }
.pb-tier-card-2 .pb-tier-num { color: #2563eb; }
.pb-tier-card-3 .pb-tier-num { color: #15803d; }
.pb-tier-card h3 { font-size: 1.1rem; color: #1a1a2e; margin-bottom: 0.5rem; }
.pb-tier-role { color: #6c757d; font-size: 0.9rem; margin-bottom: 1rem; line-height: 1.5; }
.pb-tier-card h4 { font-size: 0.78rem; color: #C9A020; letter-spacing: 0.1em; font-weight: 700; margin: 1rem 0 0.5rem; text-transform: uppercase; }
.pb-tier-card ul { list-style: none; }
.pb-tier-card ul li { padding: 0.3rem 0 0.3rem 1.25rem; position: relative; color: #2c3e50; font-size: 0.88rem; line-height: 1.5; }
.pb-tier-card ul li::before { content: '▸'; position: absolute; left: 0; color: #E6B030; }
.pb-tier-card p { font-size: 0.88rem; color: #2c3e50; line-height: 1.6; }

.pb-appendix { background: linear-gradient(180deg, #fffaf0, #fff); border: 2px solid #E6B030; }
.pb-appendix .pb-section-num { background: linear-gradient(135deg, #1a1a2e, #0f3460); color: #E6B030; }

/* Footer */
.pb-footer { background: linear-gradient(135deg, #1a1a2e, #0f3460); color: #fff; padding: 2.5rem 3rem; border-radius: 16px; display: flex; align-items: center; gap: 1.5rem; margin-top: 3rem; }
.pb-footer-mark { width: 60px; height: 60px; background: linear-gradient(135deg, #E6B030, #C9A020); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; color: #1a1a2e; flex-shrink: 0; }
.pb-footer-text { line-height: 1.7; font-size: 0.9rem; color: rgba(255,255,255,0.85); }
.pb-footer-text strong { color: #E6B030; letter-spacing: 0.1em; }
.pb-footer-conf { display: block; color: rgba(230,176,48,0.7); font-size: 0.75rem; letter-spacing: 0.2em; margin-top: 0.25rem; }

/* Print */
@media print {
    .pb-confidential-bar, .pb-toc { display: none !important; }
    .pb-layout { grid-template-columns: 1fr; }
    .pb-section { page-break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
}

/* Responsive */
@media (max-width: 1024px) {
    .pb-layout { grid-template-columns: 1fr; }
    .pb-toc { display: none; }
    .pb-main { padding: 2rem 1.5rem 4rem; }
    .pb-flow { grid-template-columns: 1fr; }
    .pb-flow-arrow { transform: rotate(90deg); margin: 0.5rem auto; }
    .pb-twocol, .pb-pillars, .pb-templates, .pb-steps, .pb-kpis { grid-template-columns: 1fr; }
    .pb-weeks { grid-template-columns: repeat(2, 1fr); }
    .pb-phases, .pb-roles, .pb-final-grid, .pb-tiers, .pb-script, .pb-compare { grid-template-columns: 1fr; }
    .pb-checklist { grid-template-columns: 1fr; }
    .pb-hero { padding: 2.5rem 1.5rem; }
    .pb-hero-title { font-size: 1.5rem; }
    .pb-section { padding: 2rem 1.25rem; }
    .pb-section-title { font-size: 1.5rem; }
}
@media (max-width: 600px) {
    .pb-weeks { grid-template-columns: 1fr; }
    .pb-confidential-bar { font-size: 0.65rem; padding: 0.5rem 0.75rem; flex-wrap: wrap; gap: 0.5rem; }
    .pb-footer { flex-direction: column; text-align: center; }
}

function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
}

async function deriveKey(password, salt, iter) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
        'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
    );
    return await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
    );
}

async function unlock() {
    const pw = document.getElementById('pwInput').value;
    const err = document.getElementById('lockError');
    const btn = document.getElementById('unlockBtn');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'กำลังถอดรหัส...';

    try {
        const salt = b64ToBytes(PB_DATA.salt);
        const iv = b64ToBytes(PB_DATA.iv);
        const cipherWithTag = b64ToBytes(PB_DATA.blob);
        const key = await deriveKey(pw, salt, PB_DATA.iter);
        const plain = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: iv },
            key,
            cipherWithTag
        );
        const html = new TextDecoder().decode(plain);
        renderPlaybook(html);
    } catch (e) {
        err.textContent = '❌ รหัสผ่านไม่ถูกต้อง';
        btn.disabled = false;
        btn.textContent = 'ปลดล็อก';
        document.getElementById('pwInput').value = '';
    }
}

function renderPlaybook(html) {
    document.getElementById('lockScreen').style.display = 'none';
    const main = document.getElementById('pbMain');
    main.innerHTML = html;
    document.getElementById('pbContainer').classList.add('active');
    buildTOC();
    setupTocActive();
    window.scrollTo({ top: 0, behavior: 'instant' });
    // Prevent text selection of password in DOM
    document.getElementById('pwInput').value = '';
}

function buildTOC() {
    const toc = document.getElementById('pbToc');
    const sections = document.querySelectorAll('#pbMain .pb-section');
    sections.forEach((sec, i) => {
        const title = sec.querySelector('.pb-section-title')?.textContent || 'Section';
        const num = sec.querySelector('.pb-section-num')?.textContent || (i+1);
        const id = sec.id;
        const a = document.createElement('a');
        a.href = '#' + id;
        a.innerHTML = '<span class="pb-toc-num">' + num + '</span> ' + title;
        toc.appendChild(a);
    });
}

function setupTocActive() {
    const tocLinks = document.querySelectorAll('.pb-toc a');
    const sections = document.querySelectorAll('#pbMain .pb-section');
    const obs = new IntersectionObserver((entries) => {
        entries.forEach(en => {
            if (en.isIntersecting) {
                const id = en.target.id;
                tocLinks.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + id));
            }
        });
    }, { rootMargin: '-30% 0px -60% 0px' });
    sections.forEach(s => obs.observe(s));
}

function lockAgain() {
    document.getElementById('pbContainer').classList.remove('active');
    document.getElementById('pbMain').innerHTML = '';
    document.getElementById('pbToc').innerHTML = '<div class="pb-toc-title">CONTENTS</div>';
    document.getElementById('lockScreen').style.display = 'flex';
    document.getElementById('unlockBtn').disabled = false;
    document.getElementById('unlockBtn').textContent = 'ปลดล็อก';
    document.getElementById('lockError').textContent = '';
    setTimeout(() => document.getElementById('pwInput').focus(), 100);
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || (e.ctrlKey && e.key === 'u')) {
        // Don't actually block - just a soft hint; security relies on encryption
    }
});
