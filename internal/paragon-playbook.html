<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Internal Document · Paragon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Sarabun:wght@300;400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --pb-ivory: #FFF6EC;
    --pb-beige: #F1E2CC;
    --pb-taupe: #CBB9A3;
    --pb-gold: #C8A76A;
    --pb-gold-deep: #A8884E;
    --pb-blush: #F6D6CF;
    --pb-ink: #2A2417;
    --pb-ink-soft: #6B5E48;
    --pb-line: #EADBC0;
    --pb-shadow: rgba(168, 136, 78, 0.12);
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Sarabun', 'Prompt', -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--font-body); -webkit-font-smoothing: antialiased; color: var(--pb-ink); }
body { background: linear-gradient(135deg, #1a1a2e 0%, #2c2418 50%, #1a1a2e 100%); min-height: 100vh; }

/* ============ LOCK SCREEN ============ */
.lock-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; position: relative; overflow: hidden; }
.lock-screen::before, .lock-screen::after {
    content: ''; position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(200,167,106,0.15) 40%, transparent 70%);
}
.lock-screen::before { width: 320px; height: 320px; top: -80px; right: -80px; }
.lock-screen::after { width: 240px; height: 240px; bottom: -60px; left: -40px; opacity: 0.6; }
.lock-card { background: rgba(255, 246, 236, 0.08); backdrop-filter: blur(24px); border: 1px solid rgba(200,167,106,0.25); border-radius: 28px; padding: 3rem 2.5rem; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 32px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04) inset; position: relative; z-index: 1; }
.lock-icon { width: 84px; height: 84px; margin: 0 auto 1.5rem; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: #fff; box-shadow: 0 12px 36px rgba(200,167,106,0.4), 0 0 0 8px rgba(200,167,106,0.08); }
.lock-brand { color: var(--pb-gold); font-size: 0.78rem; letter-spacing: 0.35em; font-weight: 700; margin-bottom: 0.5rem; }
.lock-title { color: #fff; font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; letter-spacing: 0.02em; }
.lock-sub { color: rgba(255,246,236,0.6); font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.7; }
.lock-form { display: flex; flex-direction: column; gap: 1rem; }
.lock-input { width: 100%; padding: 1rem 1.25rem; background: rgba(255,246,236,0.08); border: 1px solid rgba(200,167,106,0.25); border-radius: 14px; color: #fff; font-size: 1rem; font-family: inherit; outline: none; transition: all 0.3s; }
.lock-input:focus { border-color: var(--pb-gold); background: rgba(255,246,236,0.12); box-shadow: 0 0 0 4px rgba(200,167,106,0.12); }
.lock-input::placeholder { color: rgba(255,246,236,0.4); }
.lock-btn { padding: 1rem; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); color: #fff; border: none; border-radius: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; font-family: inherit; letter-spacing: 0.05em; }
.lock-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(200,167,106,0.45); }
.lock-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.lock-error { color: #ff8a8a; font-size: 0.9rem; min-height: 1.2rem; margin-top: 0.25rem; }
.lock-confidential { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(200,167,106,0.15); color: rgba(200,167,106,0.55); font-size: 0.7rem; letter-spacing: 0.25em; }

/* ============ PLAYBOOK ============ */
.pb-container { display: none; min-height: 100vh; background: linear-gradient(180deg, var(--pb-ivory) 0%, #fffdf7 100%); }
.pb-container.active { display: block; }

.pb-confidential-bar { background: linear-gradient(135deg, #1a1a2e, #2c2418); color: var(--pb-gold); padding: 0.55rem 2rem; text-align: center; font-size: 0.72rem; letter-spacing: 0.25em; font-weight: 600; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
.pb-conf-actions { display: flex; gap: 0.5rem; }
.pb-conf-btn { background: rgba(200,167,106,0.15); border: 1px solid rgba(200,167,106,0.35); color: var(--pb-gold); padding: 0.3rem 0.85rem; border-radius: 8px; font-size: 0.7rem; cursor: pointer; letter-spacing: 0.15em; font-family: inherit; transition: all 0.2s; }
.pb-conf-btn:hover { background: rgba(200,167,106,0.3); color: #fff; }

.pb-layout { display: grid; grid-template-columns: 280px 1fr; gap: 0; max-width: 1400px; margin: 0 auto; }

/* TOC sidebar */
.pb-toc { position: sticky; top: 42px; align-self: start; max-height: calc(100vh - 42px); overflow-y: auto; padding: 2rem 1.5rem; background: rgba(255,246,236,0.6); border-right: 1px solid var(--pb-line); }
.pb-toc-title { font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.3em; color: var(--pb-gold-deep); font-weight: 600; margin-bottom: 1rem; text-transform: uppercase; }
.pb-toc a { display: block; padding: 0.5rem 0.75rem; color: var(--pb-ink-soft); text-decoration: none; font-size: 0.85rem; border-radius: 8px; margin-bottom: 0.15rem; transition: all 0.2s; border-left: 2px solid transparent; line-height: 1.4; }
.pb-toc a:hover, .pb-toc a.active { background: rgba(200,167,106,0.1); color: var(--pb-gold-deep); border-left-color: var(--pb-gold); }
.pb-toc-num { color: var(--pb-gold); font-weight: 700; font-size: 0.75rem; margin-right: 0.4rem; }

.pb-main { padding: 3rem 3rem 5rem; min-width: 0; }

/* Hero */
.pb-hero { background: linear-gradient(135deg, #1a1a2e 0%, #2c2418 100%); color: #fff; padding: 4rem 3rem; border-radius: 28px; margin-bottom: 4rem; position: relative; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.15); }
.pb-hero::before { content: ''; position: absolute; top: -40%; right: -10%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(200,167,106,0.2), rgba(246,214,207,0.08) 40%, transparent 70%); pointer-events: none; }
.pb-hero::after { content: ''; position: absolute; bottom: -30%; left: -10%; width: 360px; height: 360px; background: radial-gradient(circle, rgba(246,214,207,0.12), transparent 70%); pointer-events: none; }
.pb-hero-inner { position: relative; }
.pb-brand { display: flex; align-items: center; gap: 1rem; margin-bottom: 2.5rem; }
.pb-brand-mark { width: 60px; height: 60px; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 2rem; font-weight: 700; color: #fff; box-shadow: 0 8px 24px rgba(200,167,106,0.4); }
.pb-brand-name { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; letter-spacing: 0.25em; color: var(--pb-gold); }
.pb-brand-sub { font-size: 0.82rem; color: rgba(255,246,236,0.5); letter-spacing: 0.15em; margin-top: 0.2rem; }
.pb-hero-title { font-family: var(--font-display); font-size: 2.2rem; font-weight: 600; line-height: 1.4; margin-bottom: 1rem; max-width: 850px; letter-spacing: 0.01em; }
.pb-hero-lead { font-size: 1.05rem; color: rgba(255,246,236,0.78); line-height: 1.85; max-width: 800px; margin-bottom: 2rem; }
.pb-hero-promise { background: rgba(200,167,106,0.1); border: 1px solid rgba(200,167,106,0.25); border-left: 4px solid var(--pb-gold); border-radius: 14px; padding: 1.5rem 1.75rem; max-width: 850px; backdrop-filter: blur(8px); }
.pb-promise-line { font-size: 1rem; line-height: 1.85; color: rgba(255,246,236,0.92); }
.pb-promise-line strong { color: var(--pb-gold); }

/* Section */
.pb-section { background: #fff; border-radius: 24px; padding: 3rem; margin-bottom: 3rem; box-shadow: 0 6px 28px var(--pb-shadow); position: relative; border: 1px solid var(--pb-line); }
.pb-section-num { position: absolute; top: -16px; left: 2rem; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); color: #fff; padding: 0.45rem 1.1rem; border-radius: 10px; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.15em; box-shadow: 0 6px 16px rgba(200,167,106,0.4); font-family: var(--font-display); }
.pb-section-title { font-family: var(--font-display); font-size: 1.9rem; font-weight: 600; color: var(--pb-ink); margin-bottom: 0.5rem; margin-top: 0.5rem; letter-spacing: 0.01em; }
.pb-section-sub { color: var(--pb-ink-soft); font-size: 1rem; margin-bottom: 2.5rem; line-height: 1.7; }
.pb-h3 { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; color: var(--pb-ink); margin: 2rem 0 1rem; letter-spacing: 0.01em; }

/* Figure reference (playbook images) */
.pb-figref { margin: 0 0 2.5rem; border-radius: 18px; overflow: hidden; background: var(--pb-ivory); border: 1px solid var(--pb-line); box-shadow: 0 8px 28px var(--pb-shadow); transition: all 0.3s; }
.pb-figref:hover { box-shadow: 0 14px 40px rgba(168, 136, 78, 0.18); transform: translateY(-2px); }
.pb-figref img { width: 100%; height: auto; display: block; }
.pb-figref figcaption { padding: 0.85rem 1.25rem; background: linear-gradient(180deg, var(--pb-ivory), var(--pb-beige)); color: var(--pb-gold-deep); font-size: 0.85rem; letter-spacing: 0.05em; border-top: 1px solid var(--pb-line); font-weight: 500; }
.pb-figref-hero { margin-bottom: 2rem; }

/* Swatch row */
.pb-swatch-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-top: 1rem; }
.pb-swatch { aspect-ratio: 1/1.2; border-radius: 12px; padding: 0.75rem 0.6rem; display: flex; flex-direction: column; justify-content: flex-end; gap: 0.2rem; border: 1px solid rgba(0,0,0,0.05); color: var(--pb-ink); }
.pb-swatch span { font-size: 0.75rem; font-weight: 600; line-height: 1.2; }
.pb-swatch code { font-size: 0.65rem; font-family: 'Courier New', monospace; opacity: 0.7; }

/* Typography sample */
.pb-type-sample { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 0; }
.pb-type-display { font-family: var(--font-display); font-size: 2.8rem; font-weight: 600; color: var(--pb-gold-deep); line-height: 1; min-width: 60px; text-align: center; }
.pb-type-body { font-family: var(--font-body); font-size: 2.8rem; font-weight: 600; color: var(--pb-ink); line-height: 1; min-width: 60px; text-align: center; }

/* Core Strategy flow */
.pb-flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr; gap: 0.5rem; align-items: center; margin-top: 2rem; }
.pb-flow-card { background: linear-gradient(135deg, var(--pb-ivory), #fff); border: 1.5px solid var(--pb-gold); border-radius: 18px; padding: 1.5rem 1rem; text-align: center; transition: all 0.3s; box-shadow: 0 4px 16px var(--pb-shadow); }
.pb-flow-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(200,167,106,0.2); }
.pb-flow-icon { font-size: 2rem; margin-bottom: 0.75rem; }
.pb-flow-en { font-family: var(--font-display); font-size: 0.9rem; color: var(--pb-gold-deep); font-weight: 600; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
.pb-flow-th { font-size: 0.9rem; color: var(--pb-ink); line-height: 1.6; }
.pb-flow-arrow { color: var(--pb-gold); font-size: 1.5rem; font-weight: 700; }

/* Two col layout */
.pb-twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
.pb-card { padding: 2rem; border-radius: 18px; }
.pb-card-pos { background: linear-gradient(135deg, #f4f9ee, #fbfdf7); border: 1px solid #c8d9b1; }
.pb-card-neg { background: linear-gradient(135deg, #fdf2f0, #fef7f5); border: 1px solid #e8b5b0; }
.pb-card-neutral { background: linear-gradient(135deg, var(--pb-ivory), var(--pb-beige)); border: 1px solid var(--pb-taupe); }
.pb-card-tag { display: inline-block; padding: 0.3rem 0.85rem; background: rgba(255,255,255,0.7); border-radius: 8px; font-size: 0.78rem; font-weight: 700; margin-bottom: 1rem; letter-spacing: 0.1em; }
.pb-card-pos .pb-card-tag { color: #5a7a3e; }
.pb-card-neg .pb-card-tag { color: #a8564e; }
.pb-card h3 { font-family: var(--font-display); font-size: 1.1rem; color: var(--pb-ink); margin-bottom: 1rem; font-weight: 600; }
.pb-card h4 { font-size: 0.95rem; color: var(--pb-ink); margin: 1rem 0 0.5rem; font-weight: 700; }
.pb-card ul { list-style: none; }
.pb-card ul li { padding: 0.4rem 0 0.4rem 1.6rem; position: relative; color: var(--pb-ink); font-size: 0.95rem; line-height: 1.65; }
.pb-card-pos ul li::before { content: '✓'; position: absolute; left: 0; color: #5a7a3e; font-weight: 700; }
.pb-card-neg ul li::before { content: '✗'; position: absolute; left: 0; color: #a8564e; font-weight: 700; }
.pb-card-neutral ul li::before { content: '•'; position: absolute; left: 0; color: var(--pb-gold-deep); font-weight: 700; }

/* Callouts */
.pb-callout { padding: 1.5rem 1.75rem; border-radius: 16px; margin: 1.5rem 0; }
.pb-callout-gold { background: linear-gradient(135deg, var(--pb-ivory), var(--pb-beige)); border-left: 5px solid var(--pb-gold); }
.pb-callout-dark { background: linear-gradient(135deg, #2a2417, #1a1a2e); color: #fff; border-left: 5px solid var(--pb-gold); }
.pb-callout-dark strong { color: var(--pb-gold); }
.pb-callout-title { font-weight: 700; color: var(--pb-gold-deep); margin-bottom: 0.75rem; font-size: 1.05rem; font-family: var(--font-display); }
.pb-callout-dark p { color: rgba(255,246,236,0.85); margin-top: 0.5rem; line-height: 1.75; }

/* Tags */
.pb-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.pb-tag { background: rgba(200,167,106,0.12); color: var(--pb-gold-deep); padding: 0.4rem 0.9rem; border-radius: 100px; font-size: 0.85rem; font-weight: 500; border: 1px solid rgba(200,167,106,0.3); }
.pb-tag-bad { background: rgba(168,86,78,0.08); color: #a8564e; border-color: rgba(168,86,78,0.25); text-decoration: line-through; }

/* Pillars */
.pb-pillars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
.pb-pillar { background: #fff; border: 1px solid var(--pb-line); border-radius: 18px; overflow: hidden; transition: all 0.3s; }
.pb-pillar:hover { transform: translateY(-4px); box-shadow: 0 16px 40px var(--pb-shadow); border-color: var(--pb-gold); }
.pb-pillar-head { background: linear-gradient(135deg, var(--pb-ivory), var(--pb-beige)); padding: 1.5rem; border-bottom: 1px solid var(--pb-line); position: relative; }
.pb-pillar-num { position: absolute; top: 1rem; right: 1rem; width: 34px; height: 34px; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; font-family: var(--font-display); }
.pb-pillar-icon { font-size: 2rem; margin-bottom: 0.5rem; }
.pb-pillar h3 { font-family: var(--font-display); font-size: 1.25rem; color: var(--pb-ink); font-weight: 600; margin-bottom: 0.4rem; }
.pb-pillar-role { color: var(--pb-ink-soft); font-size: 0.9rem; }
.pb-pillar-body { padding: 1.5rem; }
.pb-pillar-body h4 { font-size: 0.82rem; color: var(--pb-gold-deep); letter-spacing: 0.12em; font-weight: 700; margin-bottom: 0.75rem; text-transform: uppercase; }
.pb-pillar-body ul { list-style: none; margin-bottom: 1.25rem; }
.pb-pillar-body ul li { padding: 0.35rem 0 0.35rem 1.3rem; position: relative; color: var(--pb-ink); font-size: 0.92rem; line-height: 1.55; }
.pb-pillar-body ul li::before { content: '▸'; position: absolute; left: 0; color: var(--pb-gold); }
.pb-funnel { background: var(--pb-ivory); padding: 1rem 1.1rem; border-radius: 12px; font-size: 0.88rem; color: var(--pb-ink); line-height: 1.55; border-left: 3px solid var(--pb-gold); }
.pb-funnel-label { display: block; color: var(--pb-gold-deep); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.12em; margin-bottom: 0.25rem; text-transform: uppercase; }

.pb-tier-mini { display: flex; flex-direction: column; gap: 0.5rem; margin: 1rem 0; }
.pb-tier-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem 0.8rem; background: var(--pb-ivory); border-radius: 10px; }
.pb-tier-badge { padding: 0.22rem 0.7rem; border-radius: 6px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; color: #fff; }
.pb-tier-1 { background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); }
.pb-tier-2 { background: linear-gradient(135deg, #8a9bb8, #5d6e8a); }
.pb-tier-3 { background: linear-gradient(135deg, #b5a78a, #8e7e60); }
.pb-formula { background: #1a1a2e; color: var(--pb-gold); padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.9rem; text-align: center; margin-top: 1rem; }
.pb-formula strong { color: #fff; }
.pb-italic { font-style: italic; color: var(--pb-ink-soft); line-height: 1.75; margin-bottom: 1rem; }
.pb-warning { background: rgba(168,86,78,0.06); border-left: 3px solid #a8564e; padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.85rem; color: #6b3d39; margin-top: 1rem; line-height: 1.65; }

/* Compare */
.pb-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.pb-compare-bad, .pb-compare-good { padding: 1.5rem; border-radius: 16px; }
.pb-compare-bad { background: linear-gradient(135deg, #fdf2f0, #fef7f5); border: 1px solid #e8b5b0; }
.pb-compare-good { background: linear-gradient(135deg, #f4f9ee, #fbfdf7); border: 1px solid #c8d9b1; }
.pb-compare-head { font-weight: 700; margin-bottom: 0.75rem; }
.pb-compare-bad .pb-compare-head { color: #a8564e; }
.pb-compare-good .pb-compare-head { color: #5a7a3e; }

/* Mini cards */
.pb-mini-card { background: linear-gradient(135deg, var(--pb-ivory), var(--pb-beige)); border: 1px solid var(--pb-taupe); padding: 1.75rem; border-radius: 16px; }
.pb-mini-card h3 { font-family: var(--font-display); color: var(--pb-ink); font-size: 1.15rem; margin-bottom: 0.5rem; font-weight: 600; }
.pb-mini-desc { color: var(--pb-ink-soft); font-size: 0.9rem; margin-bottom: 1rem; }
.pb-mini-card ul { list-style: none; }
.pb-mini-card ul li { padding: 0.3rem 0 0.3rem 1.1rem; position: relative; color: var(--pb-ink); font-size: 0.92rem; }
.pb-mini-card ul li::before { content: '•'; position: absolute; left: 0; color: var(--pb-gold); font-weight: 700; }

/* Examples */
.pb-examples { display: flex; flex-direction: column; gap: 0.75rem; margin: 1rem 0; }
.pb-example { background: var(--pb-ivory); padding: 1rem 1.25rem; border-radius: 12px; border-left: 3px solid var(--pb-gold); }
.pb-example-title { font-weight: 600; color: var(--pb-ink); margin-bottom: 0.4rem; font-size: 0.95rem; }
.pb-example-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.pb-pri, .pb-sec { padding: 0.22rem 0.7rem; border-radius: 6px; font-size: 0.78rem; font-weight: 600; }
.pb-pri { background: rgba(200,167,106,0.18); color: var(--pb-gold-deep); }
.pb-sec { background: rgba(139,116,82,0.12); color: #6b5e48; }

/* Fields / Table */
.pb-fields { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0 2rem; }
.pb-field { background: #1a1a2e; color: var(--pb-gold); padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; }
.pb-table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--pb-line); }
.pb-table { width: 100%; border-collapse: collapse; background: #fff; }
.pb-table th { background: linear-gradient(135deg, #1a1a2e, #2c2418); color: var(--pb-gold); padding: 0.85rem 1rem; text-align: left; font-size: 0.85rem; letter-spacing: 0.08em; font-family: var(--font-display); font-weight: 600; }
.pb-table td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--pb-line); font-size: 0.9rem; color: var(--pb-ink); }
.pb-table tr:nth-child(even) td { background: var(--pb-ivory); }

/* Checklist */
.pb-checklist { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin: 1.5rem 0; }
.pb-check-item { background: var(--pb-ivory); padding: 1rem 1.25rem 1rem 3rem; border-radius: 12px; position: relative; color: var(--pb-ink); font-size: 0.95rem; line-height: 1.55; border: 1px solid var(--pb-line); }
.pb-check-item::before { content: '?'; position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }

/* Templates */
.pb-templates { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
.pb-template { background: linear-gradient(135deg, #fff, var(--pb-ivory)); border: 1px solid var(--pb-line); border-radius: 18px; padding: 1.85rem; position: relative; transition: all 0.3s; }
.pb-template:hover { transform: translateY(-4px); box-shadow: 0 16px 40px var(--pb-shadow); border-color: var(--pb-gold); }
.pb-template-num { position: absolute; top: 1rem; right: 1rem; background: linear-gradient(135deg, #1a1a2e, #2c2418); color: var(--pb-gold); padding: 0.3rem 0.75rem; border-radius: 8px; font-weight: 700; font-size: 0.85rem; letter-spacing: 0.08em; font-family: var(--font-display); }
.pb-template h3 { font-family: var(--font-display); font-size: 1.2rem; color: var(--pb-ink); margin-bottom: 0.5rem; padding-right: 3rem; font-weight: 600; }
.pb-template-role { color: var(--pb-ink-soft); font-size: 0.92rem; margin-bottom: 1rem; line-height: 1.65; }
.pb-template-fit, .pb-template-kpi { font-size: 0.88rem; color: var(--pb-ink); padding: 0.7rem 0.95rem; background: var(--pb-ivory); border-radius: 10px; margin-top: 0.5rem; line-height: 1.55; }
.pb-template-fit strong, .pb-template-kpi strong { color: var(--pb-gold-deep); }
.pb-template-warn { background: rgba(168,86,78,0.06); border-left: 3px solid #a8564e; padding: 0.7rem 0.95rem; border-radius: 10px; font-size: 0.85rem; color: #6b3d39; margin-top: 0.75rem; }

/* List */
.pb-list { list-style: none; margin: 1rem 0; }
.pb-list li { padding: 0.5rem 0 0.5rem 1.85rem; position: relative; color: var(--pb-ink); line-height: 1.7; }
.pb-list li::before { content: '✦'; position: absolute; left: 0; color: var(--pb-gold); font-weight: 700; }
.pb-numbered { list-style: none; counter-reset: numlist; margin: 1rem 0; }
.pb-numbered li { padding: 0.5rem 0 0.5rem 2.6rem; position: relative; color: var(--pb-ink); line-height: 1.7; counter-increment: numlist; }
.pb-numbered li::before { content: counter(numlist); position: absolute; left: 0; top: 0.5rem; width: 30px; height: 30px; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; font-family: var(--font-display); }

/* Formula box */
.pb-formula-box { background: linear-gradient(135deg, #1a1a2e, #2c2418); color: #fff; padding: 1.75rem; border-radius: 16px; margin: 1.5rem 0; }
.pb-formula-title { color: var(--pb-gold); font-size: 0.85rem; letter-spacing: 0.2em; font-weight: 600; margin-bottom: 1rem; text-transform: uppercase; font-family: var(--font-display); }
.pb-formula-flow { font-size: 0.95rem; line-height: 1.85; color: rgba(255,246,236,0.9); }
.pb-formula-flow span { background: rgba(200,167,106,0.18); padding: 0.32rem 0.75rem; border-radius: 8px; color: var(--pb-gold); font-weight: 600; display: inline-block; margin: 0.2rem 0; }

/* Quote */
.pb-quote { background: linear-gradient(135deg, var(--pb-ivory), var(--pb-beige)); border-left: 5px solid var(--pb-gold); padding: 2rem 2rem 2rem 4rem; border-radius: 16px; margin: 1.5rem 0; position: relative; }
.pb-quote-mark { position: absolute; top: 0.5rem; left: 1rem; font-family: var(--font-display); font-size: 3.5rem; color: var(--pb-gold); opacity: 0.5; }
.pb-quote p { color: var(--pb-ink); line-height: 1.85; margin-bottom: 0.75rem; }
.pb-quote p:last-child { margin-bottom: 0; }

/* Rules */
.pb-rule-box { background: var(--pb-ivory); border: 2px dashed var(--pb-gold); padding: 1.5rem; border-radius: 16px; margin-top: 1.5rem; }
.pb-rule-box strong { color: var(--pb-gold-deep); display: block; margin-bottom: 0.75rem; font-size: 1rem; }
.pb-rule-box ul { list-style: none; margin-top: 0.75rem; }
.pb-rule-box ul li { padding: 0.35rem 0 0.35rem 1.6rem; position: relative; color: var(--pb-ink); }
.pb-rule-box ul li::before { content: '→'; position: absolute; left: 0; color: var(--pb-gold); font-weight: 700; }
.pb-rule-tight { background: rgba(168,86,78,0.06); border-left: 4px solid #a8564e; padding: 0.9rem 1.25rem; border-radius: 10px; margin-top: 1rem; color: #6b3d39; font-size: 0.95rem; }

/* Tone */
.pb-tone { margin: 1.5rem 0; }
.pb-tone-title { font-weight: 700; color: var(--pb-gold-deep); margin-bottom: 0.75rem; font-family: var(--font-display); }

/* Script */
.pb-script { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1rem 0; }
.pb-script-bad, .pb-script-good { padding: 1.3rem; border-radius: 14px; line-height: 1.75; }
.pb-script-bad { background: linear-gradient(135deg, #fdf2f0, #fef7f5); border: 1px solid #e8b5b0; }
.pb-script-good { background: linear-gradient(135deg, #f4f9ee, #fbfdf7); border: 1px solid #c8d9b1; }
.pb-script-label { font-weight: 700; margin-bottom: 0.5rem; font-size: 0.85rem; }
.pb-script-bad .pb-script-label { color: #a8564e; }
.pb-script-good .pb-script-label { color: #5a7a3e; }

/* Steps */
.pb-steps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin-top: 1.5rem; }
.pb-step { background: linear-gradient(135deg, #fff, var(--pb-ivory)); border: 1px solid var(--pb-line); border-radius: 18px; padding: 1.85rem; position: relative; }
.pb-step-num { position: absolute; top: -16px; left: 1.5rem; width: 38px; height: 38px; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; box-shadow: 0 6px 16px rgba(200,167,106,0.4); font-family: var(--font-display); }
.pb-step h3 { font-family: var(--font-display); font-size: 1.15rem; color: var(--pb-ink); margin: 0.5rem 0 1rem; font-weight: 600; }
.pb-step ul { list-style: none; }
.pb-step ul li { padding: 0.35rem 0 0.35rem 1.6rem; position: relative; color: var(--pb-ink); font-size: 0.92rem; line-height: 1.55; }
.pb-step ul li::before { content: '✓'; position: absolute; left: 0; color: #5a7a3e; font-weight: 700; }

/* Weeks */
.pb-weeks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-top: 1.5rem; }
.pb-week { background: linear-gradient(180deg, #fff, var(--pb-ivory)); border: 1px solid var(--pb-line); border-radius: 16px; padding: 1.5rem; }
.pb-week-tag { display: inline-block; background: linear-gradient(135deg, #1a1a2e, #2c2418); color: var(--pb-gold); padding: 0.32rem 0.75rem; border-radius: 8px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; margin-bottom: 0.75rem; font-family: var(--font-display); }
.pb-week h3 { font-family: var(--font-display); font-size: 1.1rem; color: var(--pb-ink); margin-bottom: 0.5rem; font-weight: 600; }
.pb-week-goal { color: var(--pb-ink); font-size: 0.9rem; line-height: 1.55; margin-bottom: 0.75rem; }
.pb-week h4 { font-size: 0.78rem; color: var(--pb-gold-deep); letter-spacing: 0.08em; font-weight: 700; margin: 0.75rem 0 0.5rem; text-transform: uppercase; }
.pb-week ul { list-style: none; margin-bottom: 1rem; }
.pb-week ul li { padding: 0.25rem 0 0.25rem 1.1rem; position: relative; color: var(--pb-ink); font-size: 0.85rem; line-height: 1.55; }
.pb-week ul li::before { content: '▸'; position: absolute; left: 0; color: var(--pb-gold); }
.pb-week-output { background: rgba(200,167,106,0.1); padding: 0.65rem 0.9rem; border-radius: 10px; font-size: 0.82rem; line-height: 1.55; color: var(--pb-ink); border-left: 3px solid var(--pb-gold); }
.pb-week-output strong { color: var(--pb-gold-deep); }

/* Phases */
.pb-phases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 1.5rem; }
.pb-phase { background: #fff; border: 1px solid var(--pb-line); border-radius: 16px; padding: 1.85rem; position: relative; overflow: hidden; }
.pb-phase::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--pb-gold), var(--pb-gold-deep)); }
.pb-phase-tag { display: inline-block; background: linear-gradient(135deg, #1a1a2e, #2c2418); color: var(--pb-gold); padding: 0.42rem 0.9rem; border-radius: 10px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; margin-bottom: 0.75rem; font-family: var(--font-display); }
.pb-phase h3 { font-family: var(--font-display); font-size: 1.25rem; color: var(--pb-ink); margin-bottom: 1rem; font-weight: 600; }
.pb-phase h4 { font-size: 0.78rem; color: var(--pb-gold-deep); letter-spacing: 0.12em; font-weight: 700; margin: 1rem 0 0.5rem; text-transform: uppercase; }
.pb-phase ul { list-style: none; }
.pb-phase ul li { padding: 0.3rem 0 0.3rem 1.3rem; position: relative; color: var(--pb-ink); font-size: 0.9rem; line-height: 1.55; }
.pb-phase ul li::before { content: '•'; position: absolute; left: 0; color: var(--pb-gold); font-weight: 700; }

/* KPIs */
.pb-kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
.pb-kpi { background: linear-gradient(135deg, #fff, var(--pb-ivory)); border: 1px solid var(--pb-line); border-radius: 16px; padding: 1.85rem; }
.pb-kpi h3 { font-family: var(--font-display); font-size: 1.15rem; color: var(--pb-ink); margin-bottom: 0.5rem; font-weight: 600; }
.pb-kpi-sub { color: var(--pb-ink-soft); font-size: 0.85rem; margin-bottom: 1rem; }
.pb-kpi h4 { font-size: 0.8rem; color: var(--pb-gold-deep); letter-spacing: 0.08em; font-weight: 700; margin: 1rem 0 0.5rem; text-transform: uppercase; }
.pb-kpi ul { list-style: none; }
.pb-kpi ul li { padding: 0.3rem 0 0.3rem 1.3rem; position: relative; color: var(--pb-ink); font-size: 0.88rem; line-height: 1.55; }
.pb-kpi ul li::before { content: '▸'; position: absolute; left: 0; color: var(--pb-gold); }

/* Roles */
.pb-roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
.pb-role { background: linear-gradient(135deg, #fff, var(--pb-ivory)); border: 1px solid var(--pb-line); border-radius: 16px; padding: 1.5rem; text-align: left; transition: all 0.3s; }
.pb-role:hover { transform: translateY(-4px); box-shadow: 0 12px 32px var(--pb-shadow); border-color: var(--pb-gold); }
.pb-role-icon { font-size: 2rem; margin-bottom: 0.5rem; }
.pb-role h3 { font-family: var(--font-display); font-size: 1.1rem; color: var(--pb-ink); margin-bottom: 0.75rem; font-weight: 600; }
.pb-role ul { list-style: none; }
.pb-role ul li { padding: 0.3rem 0 0.3rem 1.3rem; position: relative; color: var(--pb-ink); font-size: 0.85rem; line-height: 1.55; }
.pb-role ul li::before { content: '▸'; position: absolute; left: 0; color: var(--pb-gold); }

/* Principle */
.pb-principle { background: linear-gradient(135deg, #1a1a2e, #2c2418); color: #fff; padding: 2.5rem 2.5rem; border-radius: 20px; margin-bottom: 1.5rem; text-align: center; position: relative; overflow: hidden; }
.pb-principle::before { content: ''; position: absolute; top: -50%; right: -10%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(200,167,106,0.15), transparent 70%); pointer-events: none; }
.pb-principle p { font-size: 1.05rem; line-height: 1.85; color: rgba(255,246,236,0.85); margin-bottom: 0.5rem; position: relative; }
.pb-principle-bold { font-family: var(--font-display); font-size: 1.3rem !important; color: var(--pb-gold) !important; font-weight: 600; }
.pb-principle-alt { background: linear-gradient(135deg, var(--pb-gold-deep), var(--pb-gold)); }
.pb-principle-alt p { color: rgba(255,255,255,0.95); }
.pb-principle-alt .pb-principle-bold { color: #fff !important; }

/* Final summary */
.pb-final-intro { font-size: 1.1rem; color: var(--pb-ink); line-height: 1.75; margin-bottom: 2rem; text-align: center; }
.pb-final-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
.pb-final-card { background: linear-gradient(135deg, #1a1a2e, #2c2418); color: #fff; padding: 1.75rem 1rem; border-radius: 16px; text-align: center; position: relative; overflow: hidden; }
.pb-final-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--pb-gold), var(--pb-gold-deep)); }
.pb-final-en { font-family: var(--font-display); color: var(--pb-gold); font-weight: 600; letter-spacing: 0.1em; font-size: 1rem; margin-bottom: 0.4rem; }
.pb-final-th { color: rgba(255,246,236,0.85); font-size: 0.95rem; }
.pb-final-quote { background: linear-gradient(135deg, var(--pb-ivory), var(--pb-beige)); border: 2px solid var(--pb-gold); border-radius: 18px; padding: 2rem 2.5rem 2rem 4rem; position: relative; margin-top: 1.5rem; }
.pb-final-quote p { font-size: 1.05rem; color: var(--pb-ink); line-height: 1.85; margin-bottom: 0.75rem; }
.pb-final-quote p:last-child { margin-bottom: 0; }
.pb-final-quote strong { color: var(--pb-gold-deep); }

/* Tier cards (appendix) */
.pb-tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin: 1.5rem 0; }
.pb-tier-card { background: #fff; border-radius: 18px; padding: 1.85rem; position: relative; overflow: hidden; border-top: 5px solid var(--pb-gold); box-shadow: 0 8px 24px var(--pb-shadow); border-left: 1px solid var(--pb-line); border-right: 1px solid var(--pb-line); border-bottom: 1px solid var(--pb-line); }
.pb-tier-card-1 { border-top-color: var(--pb-gold); }
.pb-tier-card-2 { border-top-color: #5d6e8a; }
.pb-tier-card-3 { border-top-color: #8e7e60; }
.pb-tier-num { font-family: var(--font-display); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.2em; margin-bottom: 0.5rem; }
.pb-tier-card-1 .pb-tier-num { color: var(--pb-gold-deep); }
.pb-tier-card-2 .pb-tier-num { color: #5d6e8a; }
.pb-tier-card-3 .pb-tier-num { color: #8e7e60; }
.pb-tier-card h3 { font-family: var(--font-display); font-size: 1.15rem; color: var(--pb-ink); margin-bottom: 0.5rem; font-weight: 600; }
.pb-tier-role { color: var(--pb-ink-soft); font-size: 0.9rem; margin-bottom: 1rem; line-height: 1.55; }
.pb-tier-card h4 { font-size: 0.76rem; color: var(--pb-gold-deep); letter-spacing: 0.12em; font-weight: 700; margin: 1rem 0 0.5rem; text-transform: uppercase; }
.pb-tier-card ul { list-style: none; }
.pb-tier-card ul li { padding: 0.3rem 0 0.3rem 1.3rem; position: relative; color: var(--pb-ink); font-size: 0.88rem; line-height: 1.55; }
.pb-tier-card ul li::before { content: '▸'; position: absolute; left: 0; color: var(--pb-gold); }
.pb-tier-card p { font-size: 0.88rem; color: var(--pb-ink); line-height: 1.65; }

.pb-appendix { background: linear-gradient(180deg, var(--pb-ivory), #fff); border: 2px solid var(--pb-gold); }
.pb-appendix .pb-section-num { background: linear-gradient(135deg, #1a1a2e, #2c2418); color: var(--pb-gold); }

/* Footer */
.pb-footer { background: linear-gradient(135deg, #1a1a2e, #2c2418); color: #fff; padding: 2.5rem 3rem; border-radius: 20px; display: flex; align-items: center; gap: 1.5rem; margin-top: 3rem; position: relative; overflow: hidden; }
.pb-footer::before { content: ''; position: absolute; top: -50%; right: -10%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(200,167,106,0.12), transparent 70%); pointer-events: none; }
.pb-footer-mark { width: 64px; height: 64px; background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; color: #fff; flex-shrink: 0; box-shadow: 0 8px 24px rgba(200,167,106,0.4); position: relative; }
.pb-footer-text { line-height: 1.75; font-size: 0.9rem; color: rgba(255,246,236,0.85); position: relative; }
.pb-footer-text strong { color: var(--pb-gold); letter-spacing: 0.15em; font-family: var(--font-display); font-weight: 600; }
.pb-footer-conf { display: block; color: rgba(200,167,106,0.65); font-size: 0.72rem; letter-spacing: 0.25em; margin-top: 0.4rem; }

/* Print */
@media print {
    .pb-confidential-bar, .pb-toc { display: none !important; }
    .pb-layout { grid-template-columns: 1fr; }
    .pb-section { page-break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
    .pb-figref { page-break-inside: avoid; }
}

/* Responsive */
@media (max-width: 1024px) {
    .pb-layout { grid-template-columns: 1fr; }
    .pb-toc { display: none; }
    .pb-main { padding: 2rem 1.25rem 4rem; }
    .pb-flow { grid-template-columns: 1fr; }
    .pb-flow-arrow { transform: rotate(90deg); margin: 0.5rem auto; }
    .pb-twocol, .pb-pillars, .pb-templates, .pb-steps, .pb-kpis { grid-template-columns: 1fr; }
    .pb-weeks { grid-template-columns: repeat(2, 1fr); }
    .pb-phases, .pb-roles, .pb-final-grid, .pb-tiers, .pb-script, .pb-compare { grid-template-columns: 1fr; }
    .pb-checklist { grid-template-columns: 1fr; }
    .pb-hero { padding: 2.5rem 1.5rem; }
    .pb-hero-title { font-size: 1.5rem; }
    .pb-section { padding: 2rem 1.25rem; }
    .pb-section-title { font-size: 1.55rem; }
    .pb-swatch-row { grid-template-columns: repeat(5, 1fr); gap: 0.35rem; }
}
@media (max-width: 600px) {
    .pb-weeks { grid-template-columns: 1fr; }
    .pb-confidential-bar { font-size: 0.62rem; padding: 0.5rem 0.75rem; flex-wrap: wrap; gap: 0.5rem; letter-spacing: 0.12em; }
    .pb-footer { flex-direction: column; text-align: center; }
    .pb-swatch-row { grid-template-columns: repeat(2, 1fr); }
    .pb-swatch { aspect-ratio: auto; min-height: 70px; }
}

/* === Role Badges === */
.pb-role-badges { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.6rem 0 1rem; }
.pb-role-badge { display: inline-block; padding: 0.15rem 0.55rem; border-radius: 999px; font-size: 0.62rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-family: var(--font-body); border: 1px solid transparent; }
.pb-role-all        { background: rgba(42,36,23,0.08);   color: #2A2417; border-color: rgba(42,36,23,0.2); }
.pb-role-leadership { background: rgba(168,136,78,0.15); color: #6e5530; border-color: rgba(168,136,78,0.4); }
.pb-role-marketing  { background: rgba(200,167,106,0.18); color: #8b6f3a; border-color: rgba(200,167,106,0.45); }
.pb-role-doctor     { background: rgba(74,93,76,0.15);  color: #3d5240; border-color: rgba(74,93,76,0.4); }
.pb-role-sales      { background: rgba(246,214,207,0.5); color: #a25149; border-color: rgba(220,150,140,0.5); }
.pb-role-admin      { background: rgba(203,185,163,0.3); color: #6b5c44; border-color: rgba(203,185,163,0.6); }
.pb-role-nurse      { background: rgba(150,180,200,0.2); color: #3e5b73; border-color: rgba(120,160,190,0.5); }

/* === Sidebar Filter & Search === */
.pb-toc-controls { padding: 0.5rem 0 1rem; border-bottom: 1px solid rgba(168,136,78,0.18); margin-bottom: 1rem; }
.pb-toc-label { font-size: 0.62rem; letter-spacing: 0.18em; color: var(--pb-gold-deep); text-transform: uppercase; margin: 0.6rem 0 0.4rem; font-weight: 600; }
.pb-search { width: 100%; padding: 0.55rem 0.75rem; border: 1px solid rgba(168,136,78,0.3); border-radius: 8px; background: #fff; font-family: var(--font-body); font-size: 0.82rem; color: var(--pb-ink); outline: none; transition: border-color 0.2s; }
.pb-search:focus { border-color: var(--pb-gold); box-shadow: 0 0 0 3px rgba(200,167,106,0.15); }
.pb-search::placeholder { color: rgba(42,36,23,0.4); }
.pb-search-hint { font-size: 0.62rem; color: rgba(42,36,23,0.5); margin-top: 0.3rem; letter-spacing: 0.06em; }
.pb-chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.pb-chip { padding: 0.25rem 0.6rem; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 999px; cursor: pointer; transition: all 0.18s; border: 1px solid rgba(168,136,78,0.3); background: #fff; color: var(--pb-ink); user-select: none; font-family: var(--font-body); }
.pb-chip:hover { border-color: var(--pb-gold); }
.pb-chip.active { background: linear-gradient(135deg, var(--pb-gold), var(--pb-gold-deep)); color: #fff; border-color: var(--pb-gold-deep); }

/* === Grouped TOC === */
.pb-toc-group { margin-bottom: 1.1rem; }
.pb-toc-group-head { font-size: 0.62rem; letter-spacing: 0.2em; color: var(--pb-gold-deep); text-transform: uppercase; margin: 0.5rem 0 0.45rem; font-weight: 700; padding: 0.3rem 0.5rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; border-radius: 6px; transition: background 0.15s; }
.pb-toc-group-head:hover { background: rgba(200,167,106,0.08); }
.pb-toc-group-head .pb-caret { transition: transform 0.2s; font-size: 0.6rem; opacity: 0.6; }
.pb-toc-group.collapsed .pb-caret { transform: rotate(-90deg); }
.pb-toc-group.collapsed .pb-toc-group-body { display: none; }
.pb-toc-group-body { display: block; }

function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
}

async function deriveKey(password, salt, iter) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']);
    return await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' },
        baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
}

async function unlock() {
    const pw = document.getElementById('pwInput').value;
    const err = document.getElementById('lockError');
    const btn = document.getElementById('unlockBtn');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'กำลังถอดรหัส...';
    try {
        const salt = b64ToBytes(PB_DATA.salt);
        const iv = b64ToBytes(PB_DATA.iv);
        const cipherWithTag = b64ToBytes(PB_DATA.blob);
        const key = await deriveKey(pw, salt, PB_DATA.iter);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, cipherWithTag);
        renderPlaybook(new TextDecoder().decode(plain));
    } catch (e) {
        err.textContent = '❌ รหัสผ่านไม่ถูกต้อง';
        btn.disabled = false;
        btn.textContent = 'ปลดล็อก';
        document.getElementById('pwInput').value = '';
    }
}

function renderPlaybook(html) {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('pbMain').innerHTML = html;
    document.getElementById('pbContainer').classList.add('active');
    buildTOC();
    setupFilterUI();
    setupTocActive();
    setupEnhancements();
    window.scrollTo({ top: 0, behavior: 'instant' });
    document.getElementById('pwInput').value = '';
}

function buildTOC() {
    const tocList = document.getElementById('pbTocList');
    tocList.innerHTML = '';
    const groups = {
        foundation: { label: 'Foundation', sections: [] },
        marketing:  { label: 'Marketing & Brand', sections: [] },
        doctor:     { label: 'Doctor & Content', sections: [] },
        sales:      { label: 'Sales & Service', sections: [] },
        ops:        { label: 'Operations & Team', sections: [] },
        appendix:   { label: 'Appendix', sections: [] }
    };
    document.querySelectorAll('#pbMain .pb-section').forEach((sec) => {
        const cat = sec.getAttribute('data-category') || 'foundation';
        if (groups[cat]) groups[cat].sections.push(sec);
        else groups.foundation.sections.push(sec);
    });
    Object.entries(groups).forEach(([key, g]) => {
        if (g.sections.length === 0) return;
        const grp = document.createElement('div');
        grp.className = 'pb-toc-group';
        grp.dataset.group = key;
        const head = document.createElement('div');
        head.className = 'pb-toc-group-head';
        head.innerHTML = '<span>' + g.label + '</span><span class="pb-caret">▼</span>';
        head.addEventListener('click', () => grp.classList.toggle('collapsed'));
        const body = document.createElement('div');
        body.className = 'pb-toc-group-body';
        g.sections.forEach(sec => {
            const title = sec.querySelector('.pb-section-title')?.textContent || 'Section';
            const num = sec.querySelector('.pb-section-num')?.textContent || '·';
            const roles = sec.getAttribute('data-roles') || 'all';
            const a = document.createElement('a');
            a.href = '#' + sec.id;
            a.dataset.roles = roles;
            a.dataset.search = (num + ' ' + title).toLowerCase();
            a.innerHTML = '<span class="pb-toc-num">' + num + '</span> ' + title;
            body.appendChild(a);
        });
        grp.appendChild(head);
        grp.appendChild(body);
        tocList.appendChild(grp);
    });
}

let activeRole = 'all';
function applyRoleFilter(role) {
    activeRole = role;
    document.querySelectorAll('#pbChips .pb-chip').forEach(c => {
        c.classList.toggle('active', c.dataset.role === role);
    });
    const matches = (rolesAttr) => {
        if (role === 'all') return true;
        const list = (rolesAttr || 'all').split(',').map(s => s.trim());
        return list.includes('all') || list.includes(role);
    };
    document.querySelectorAll('#pbMain .pb-section').forEach(sec => {
        sec.classList.toggle('pb-hidden', !matches(sec.getAttribute('data-roles')));
    });
    document.querySelectorAll('#pbTocList a').forEach(a => {
        a.classList.toggle('pb-hidden', !matches(a.dataset.roles));
    });
    document.querySelectorAll('.pb-toc-group').forEach(g => {
        const visible = g.querySelectorAll('a:not(.pb-hidden)').length;
        g.style.display = visible ? '' : 'none';
    });
    // re-apply search if active
    const q = document.getElementById('pbSearch').value.trim();
    if (q) searchPlaybook(q);
}

function searchPlaybook(query) {
    const q = query.trim().toLowerCase();
    // clear marks
    document.querySelectorAll('mark.pb-mark').forEach(m => {
        const t = document.createTextNode(m.textContent);
        m.parentNode.replaceChild(t, m);
    });
    if (!q) {
        // reset visibility based on active role
        applyRoleFilter(activeRole);
        return;
    }
    const rolesMatch = (rolesAttr) => {
        if (activeRole === 'all') return true;
        const list = (rolesAttr || 'all').split(',').map(s => s.trim());
        return list.includes('all') || list.includes(activeRole);
    };
    document.querySelectorAll('#pbMain .pb-section').forEach(sec => {
        const txt = sec.textContent.toLowerCase();
        const hit = txt.includes(q) && rolesMatch(sec.getAttribute('data-roles'));
        sec.classList.toggle('pb-hidden', !hit);
    });
    document.querySelectorAll('#pbTocList a').forEach(a => {
        const hit = (a.dataset.search.includes(q) || !document.querySelector(a.getAttribute('href'))?.classList.contains('pb-hidden')) && rolesMatch(a.dataset.roles);
        a.classList.toggle('pb-hidden', !hit);
    });
    document.querySelectorAll('.pb-toc-group').forEach(g => {
        const visible = g.querySelectorAll('a:not(.pb-hidden)').length;
        g.style.display = visible ? '' : 'none';
    });
}

function setupFilterUI() {
    document.querySelectorAll('#pbChips .pb-chip').forEach(c => {
        c.addEventListener('click', () => applyRoleFilter(c.dataset.role));
    });
    const search = document.getElementById('pbSearch');
    let timer;
    search.addEventListener('input', (e) => {
        clearTimeout(timer);
        timer = setTimeout(() => searchPlaybook(e.target.value), 150);
    });
    search.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { search.value = ''; searchPlaybook(''); search.blur(); }
    });
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            search.focus();
            search.select();
        }
    });
}

function setupTocActive() {
    const tocLinks = document.querySelectorAll('#pbTocList a');
    const sections = document.querySelectorAll('#pbMain .pb-section');
    const obs = new IntersectionObserver((entries) => {
        entries.forEach(en => {
            if (en.isIntersecting) {
                const id = en.target.id;
                tocLinks.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + id));
            }
        });
    }, { rootMargin: '-30% 0px -60% 0px' });
    sections.forEach(s => obs.observe(s));
}

function setupEnhancements() {
    const container = document.getElementById('pbContainer');
    const sections = document.querySelectorAll('#pbMain .pb-section');
    container.classList.add('js-reveal');
    sections.forEach(s => s.classList.add('pb-pending'));
    const revObs = new IntersectionObserver((entries) => {
        entries.forEach(en => {
            if (en.isIntersecting) {
                en.target.classList.add('pb-in');
                en.target.classList.remove('pb-pending');
                revObs.unobserve(en.target);
            }
        });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
    sections.forEach(s => revObs.observe(s));

    const prog = document.getElementById('pbProgress');
    const totop = document.getElementById('pbToTop');
    const onScroll = () => {
        const h = document.documentElement;
        const max = h.scrollHeight - h.clientHeight;
        const pct = max > 0 ? (h.scrollTop / max) * 100 : 0;
        if (prog) prog.style.width = pct + '%';
        if (totop) totop.classList.toggle('show', h.scrollTop > 600);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    document.querySelectorAll('#pbTocList a').forEach(a => {
        a.addEventListener('click', (e) => {
            const id = a.getAttribute('href');
            const t = id && document.querySelector(id);
            if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        });
    });
}

function lockAgain() {
    document.getElementById('pbContainer').classList.remove('active');
    document.getElementById('pbMain').innerHTML = '';
    document.getElementById('pbTocList').innerHTML = '';
    document.getElementById('pbSearch').value = '';
    document.getElementById('lockScreen').style.display = 'flex';
    document.getElementById('unlockBtn').disabled = false;
    document.getElementById('unlockBtn').textContent = 'ปลดล็อก';
    document.getElementById('lockError').textContent = '';
    activeRole = 'all';
    setTimeout(() => document.getElementById('pwInput').focus(), 100);
}
